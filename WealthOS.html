<style>
:root {
  --card: #111E33; --card2: #162030; --card-foreground: #E4EAF6;
  --accent: #4F8EF7; --accent-foreground: #ffffff;
  --border: #243350;
  --navy: #0E1C2F; --navy2: #162539; --slate: #1E3150;
  --gold: #C9A227; --green: #27AE7A; --red: #E05454; --orange: #D97A30;
  --subtext: #8FA3C8;
  --foreground: var(--card-foreground);
  --bg: var(--navy);
  --background: #0A1525;
}
:root[data-theme="light"] {
  --background: #F4F6FB;
  --foreground: #11203A;
  --card: #FFFFFF; --card2: #F8FAFD; --card-foreground: #11203A;
  --accent: #2E6FE0; --accent-foreground: #FFFFFF;
  --border: #DBE2EE;
  --navy: #FFFFFF; --navy2: #F1F4FA; --slate: #E9EEF7;
  --gold: #B8932B; --green: #1F9466; --red: #D14545; --orange: #C9651F;
  --subtext: #5C6E8E;
  --bg: #FFFFFF;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--foreground); font-size: 13.5px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .brand { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.01em; }
a { color: inherit; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ═══ shared component classes (ported from WealthOS) ═══ */
.wos-input {
  width: 100%; background: var(--navy2); border: 1px solid var(--border); border-radius: 7px;
  padding: 8px 10px; font-size: 12.5px; color: var(--foreground); font-family: inherit;
}
.wos-input:focus { outline: none; border-color: var(--accent); }
.wos-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.wos-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--subtext); margin-bottom: 10px; }
.wos-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.wos-table th { text-align: left; font-weight: 600; color: var(--subtext); padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.wos-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
.wos-table tr:last-child td { border-bottom: none; }
.wos-table td.num, .wos-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.wos-pill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 20px; font-size: 11px; font-weight: 600; border: none; cursor: pointer; }

function fmtINR(n, decimals) {
  decimals = decimals || 0;
  if (!Number.isFinite(n)) return "—";
  const neg = n < 0, abs = Math.abs(n);
  const fixed = abs.toFixed(decimals);
  const [whole, frac] = fixed.split(".");
  const lastThree = whole.slice(-3);
  const rest = whole.slice(0, -3);
  const grouped = rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + lastThree : lastThree;
  return (neg ? "(" : "") + "₹" + grouped + (frac ? "." + frac : "") + (neg ? ")" : "");
}
function fmtCr(n) {
  if (!Number.isFinite(n)) return "—";
  if (Math.abs(n) >= 1e7) return (n / 1e7).toFixed(2) + " Cr";
  if (Math.abs(n) >= 1e5) return (n / 1e5).toFixed(1) + " L";
  return fmtINR(n);
}
function fmtPct(n, decimals) {
  decimals = decimals === undefined ? 1 : decimals;
  if (!Number.isFinite(n)) return "—";

/* ─── Core compute engine (ported faithfully from compute.ts) ─── */
const FREQ_MONTHLY = { Monthly: 1, Quarterly: 1 / 3, "Semi-Annual": 1 / 6, Annual: 1 / 12, "Bi-Annual": 2 / 12 };
const FREQ_ANNUAL = { Monthly: 12, Quarterly: 4, "Semi-Annual": 2, Annual: 1, "Bi-Annual": 0.5 };
const monthlyOf = (l) => l.amount * FREQ_MONTHLY[l.freq];
const annualOf = (l) => l.amount * FREQ_ANNUAL[l.freq];
const sumA = (list) => list.reduce((s, l) => s + annualOf(l), 0);
const sumM = (list) => list.reduce((s, l) => s + monthlyOf(l), 0);

function pvAnnuityDue(rate, nper, pmt) {
  if (Math.abs(rate) < 1e-10) return pmt * nper;
  return (pmt * (1 - Math.pow(1 + rate, -nper)) / rate) * (1 + rate);
}
function fvCompute(rate, nper, pmt, pv) {
  if (Math.abs(rate) < 1e-10) return pv + pmt * nper;
  return pv * Math.pow(1 + rate, nper) + pmt * (Math.pow(1 + rate, nper) - 1) / rate;
}
function pmtForFV(rate, nper, fvTarget) {
  if (Math.abs(rate) < 1e-10) return -fvTarget / nper;
  return -fvTarget * rate / (Math.pow(1 + rate, nper) - 1);
}
function ageFromDob(dob) {
  const d = new Date(dob);
  if (Number.isNaN(d.getTime())) return 0;
  const now = new Date();
  let a = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < d.getDate())) a--;
  return a;
}
function newRegimeTax(taxable) {
  if (taxable <= 400000) return 0;
  if (taxable <= 800000) return (taxable - 400000) * 0.05;
  if (taxable <= 1200000) return (taxable - 800000) * 0.10 + 20000;
  if (taxable <= 1600000) return (taxable - 1200000) * 0.15 + 60000;
  if (taxable <= 2000000) return (taxable - 1600000) * 0.20 + 120000;
  if (taxable <= 2400000) return (taxable - 2000000) * 0.25 + 200000;
  return (taxable - 2400000) * 0.30 + 300000;
}
/* PFRDA-style lifecycle allocation, extended to 5 risk tiers (real NPS only

function compute(s) {

  const annualIncomeTax = s.profile.taxRegime === "Old Regime" ? grossAnnual * s.profile.effOldTaxRate : taxNewRegime;

  const epfEmpMonthly = s.epf.empCont;

  const fixedExpRows = s.fixedExp.map((r) => ({ ...r, monthly: monthlyOf(r), annual: annualOf(r) }));

  const totalLiquid = s.liquid.savings + s.liquid.fd + s.liquid.liquidMF + s.liquid.cash;
  const totalSchemes = s.schemes.reduce((a, b) => a + b.balance, 0);
  const totalEquity = s.equity.reduce((a, b) => a + b.value, 0);
  const totalCommodities = s.commodities.reduce((a, b) => a + b.value, 0);
  const totalRealEstate = s.realEstate.reduce((a, b) => a + b.value, 0);
  const totalOther = s.otherInv.reduce((a, b) => a + b.value, 0);
  const totalDebtAssets = s.debtAssets.reduce((a, b) => a + b.value, 0);
  const totalAssets = totalLiquid + totalSchemes + s.epf.balance + s.nps.tier1Bal + s.nps.tier2Bal + totalEquity + totalCommodities + totalRealEstate + totalOther + totalDebtAssets;

    const P = l.outstanding, nMonths = Math.max(0, l.tenureLeftMonths || 0), i = l.rate / 12;

    if (fLo * fMid < 0) { hi = mid; fHi = fMid; } else { lo = mid; fLo = fMid; }
  }
  return (lo + hi) / 2;
}
function runEndowmentCalculation(i) {
  const ssv = calcSSV(i), gsv = calcGSV(i);
  const gsvApplicable = gsv !== null;
  const surrenderValue = i.knownSurrenderValue !== undefined && i.knownSurrenderValue > 0
    ? i.knownSurrenderValue
    : (gsvApplicable ? Math.max(ssv, gsv) : ssv);
  const maturity = maturityValueEnd(i);
  const maturityYear = i.startYear + i.term - 1;
  const policyYearOfSurrender = i.surrenderYear - i.startYear + 1;
  const r = i.mfReturn / 100;
  const continueCFs = [], investCFs = [], rows = [];
  let mfBal = 0;
  for (let absYear = i.startYear; absYear <= maturityYear; absYear++) {
    const policyYr = absYear - i.startYear + 1;
    const premiumDue = i.premiumType === "single" ? absYear === i.startYear : (absYear <= i.lastPremiumYear && absYear >= i.startYear);
    let cCF = 0;
    if (premiumDue) cCF -= i.annualPremium;
    if (absYear === maturityYear) cCF += maturity;
    continueCFs.push(cCF);
    const reinvest = i.reinvestSavedPremiums !== false;
    let sCF = 0;
    if (absYear < i.surrenderYear) { if (premiumDue) sCF -= i.annualPremium; }
    else if (absYear === i.surrenderYear) {
      // Receiving the surrender value and immediately reinvesting it is a wash —
      // it's money you already own via the policy, not new cash from your pocket —
      // so it only seeds the MF balance, it isn't charged again as an outflow.
      mfBal = surrenderValue;
      // The premium for the surrender year itself is assumed paid, consistent with
      // the paid-premium count used by the SSV/GSV formulas above, regardless of strategy.
      if (premiumDue) sCF -= i.annualPremium;
    } else {
      mfBal = mfBal * (1 + r);
      if (premiumDue && absYear <= i.lastPremiumYear && reinvest) { sCF -= i.annualPremium; mfBal += i.annualPremium; }
    }
    if (absYear === maturityYear && absYear >= i.surrenderYear) sCF += mfBal;
    rows.push({ year: absYear, policyYear: policyYr, continueCF: cCF, surrenderCF: sCF, mfBalance: absYear >= i.surrenderYear ? mfBal : 0 });
    investCFs.push(sCF);
  }
  const continueIRR = irrCalc(continueCFs), surrenderIRR = irrCalc(investCFs);
  return { ssv, gsv, gsvApplicable, surrenderValue, maturity, continueIRR, surrenderIRR, mfFinalValue: mfBal, rows, policyYearOfSurrender, yearsToMaturity: maturityYear - i.surrenderYear };
}

/* ══════════════════════════════════════════════════════════════
   Google Sheets integration — reads/writes the SAME "Wealth CRM Data"
   spreadsheet WealthCRM.html uses. WealthOS never creates that sheet or
   touches its Clients/Tasks/Pipeline/Log tabs — it only adds a "WealthOS"
   tab, keyed by the same numeric client id, and only ever updates the ONE
   row for whichever client is currently open (never a bulk clear+rewrite,
   since WealthOS only ever holds one client's data in memory at a time).

   Auth pattern (token client, sheet find-by-name, gFetch wrapper) mirrors
   WealthCRM.html's already-working implementation — the parts most likely
   to need a real login to confirm are gLogin()/gGotToken() (the OAuth
   popup itself); the field-mapping and row read/write logic below can be
   checked by inspection against WealthCRM's schema.

   SETUP REQUIRED (one-time, in Google Cloud Console):
   Add WealthOS's actual URL/origin to the "Authorized JavaScript origins"
   list of the SAME OAuth Client ID WealthCRM.html already uses, so this
   page is allowed to request tokens against it. If WealthOS is served
   from a different domain than WealthCRM, this step is mandatory or
   sign-in will fail with a redirect_uri_mismatch / origin error.
   ══════════════════════════════════════════════════════════════ */
const G_CLIENT_ID = '843199212188-745fq16rmt4g3r0gc82tbv7gmnmqo1e9.apps.googleusercontent.com'; // same client as WealthCRM.html
const G_SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email';
const G_SHEET_NAME = 'Wealth CRM Data'; // must match WealthCRM.html's G_SHEET_NAME exactly
const WOS_TAB = 'WealthOS';
const G_LS = 'mfd_g_'; // same localStorage prefix as WealthCRM — if same-origin, a session signed in on one carries over to the other

var G = { ok: false, user: null, tok: null, exp: null, sheet: null, tc: null, clients: [], currentClientId: null };
// Set when opened via e.g. wealthos.html?clientId=123&view=report (a link from WealthCRM).
const DEEP_LINK = (() => {
  const p = new URLSearchParams(location.search);
  const idRaw = p.get("clientId");
  return { clientId: idRaw ? +idRaw : null, view: p.get("view") };
})();

function gInit() {
  const s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client";
  s.onload = () => {
    G.tc = google.accounts.oauth2.initTokenClient({ client_id: G_CLIENT_ID, scope: G_SCOPES, callback: gGotToken });
    const stored = localStorage.getItem(G_LS + "u");
    if (stored) {
      try { G.user = JSON.parse(stored); G.sheet = localStorage.getItem(G_LS + "s"); G.tc.requestAccessToken({ prompt: "none" }); } catch (e) {}
    }
  };
  document.head.appendChild(s);
}
function gLogin() { if (!G.tc) { alert("Google sign-in is still loading — try again in a second."); return; } G.tc.requestAccessToken({ prompt: "consent" }); }

function gGotToken(r) {
  if (r.error) {
    if (r.error !== "interaction_required") { G.ok = false; alert("Google sign-in failed: " + r.error); }
    return;
  }
  G.tok = r.access_token; G.exp = Date.now() + r.expires_in * 1000; G.ok = true;
  gFetch("https://www.googleapis.com/oauth2/v3/userinfo").then((u) => {
    G.user = { name: u.name, email: u.email };
    localStorage.setItem(G_LS + "u", JSON.stringify(G.user));
  }).catch(() => {});
  if (DEEP_LINK.clientId) gOpenDeepLinkClient(DEEP_LINK.clientId);
  else gOpenClientPicker();
}

// Arrived via a link like wealthos.html?clientId=123&view=report (e.g. a button in WealthCRM).
// Loads that one client directly — no picker — and, if view=report, opens the report
// immediately, matching what "Generate & Open Report" already does inside the app.
async function gOpenDeepLinkClient(clientId) {
  try {
    await gEnsureSheet();
    await gEnsureWosTab();
    await gLoadClientList();
    await gSelectClient(clientId);
    if (DEEP_LINK.view === "report") openGeneratedReportInNewTab();
  } catch (e) {
    alert("Could not open this client from the link: " + e.message);
  }
}

async function gFetch(url, o = {}) {
  if (!G.tok) throw new Error("Not signed in");
  const r = await fetch(url, { ...o, headers: { Authorization: "Bearer " + G.tok, "Content-Type": "application/json", ...(o.headers || {}) } });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error((e && e.error && e.error.message) || "HTTP " + r.status); }
  return r.status === 204 ? null : r.json();
}

async function gEnsureSheet() {
  let id = G.sheet || localStorage.getItem(G_LS + "s");
  if (id) {
    try { await gFetch("https://sheets.googleapis.com/v4/spreadsheets/" + id + "?fields=spreadsheetId"); G.sheet = id; return; }
    catch (e) { id = null; }
  }
  const q = encodeURIComponent("name='" + G_SHEET_NAME + "' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
  const dr = await gFetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=files(id)&pageSize=1");
  if (dr.files && dr.files[0]) { G.sheet = dr.files[0].id; localStorage.setItem(G_LS + "s", G.sheet); return; }
  throw new Error('Could not find your "' + G_SHEET_NAME + '" sheet. Open WealthCRM and sign in there first — it creates this sheet on first use.');
}

async function gEnsureWosTab() {
  const meta = await gFetch("https://sheets.googleapis.com/v4/spreadsheets/" + G.sheet + "?fields=sheets.properties.title");
  const exists = (meta.sheets || []).some((s) => s.properties.title === WOS_TAB);
  if (exists) return;
  await gFetch("https://sheets.googleapis.com/v4/spreadsheets/" + G.sheet + ":batchUpdate", {
    method: "POST",
    body: JSON.stringify({ requests: [{ addSheet: { properties: { title: WOS_TAB } } }] }),
  });
  await gFetch("https://sheets.googleapis.com/v4/spreadsheets/" + G.sheet + "/values/" + WOS_TAB + "!A1:C1?valueInputOption=RAW", {
    method: "PUT",
    body: JSON.stringify({ values: [["clientId", "updatedAt", "stateJson"]] }),
  });
}

// Pulls id/name/dob/aum/risk from the CRM's Clients tab (columns A–K) — read-only,
// WealthOS never writes back to this range.
async function gLoadClientList() {
  const res = await gFetch("https://sheets.googleapis.com/v4/spreadsheets/" + G.sheet + "/values/Clients!A2:K");
  const rows = res.values || [];
  G.clients = rows
    .map((r) => ({ id: +r[0] || 0, name: r[1] || "", dob: r[6] || "", aum: +r[7] || 0, risk: (r[10] || "moderate") }))
    .filter((c) => c.id && c.name)
    .sort((a, b) => a.name.localeCompare(b.name));
}

async function gLoadClientState(clientId) {
  const res = await gFetch("https://sheets.googleapis.com/v4/spreadsheets/" + G.sheet + "/values/" + WOS_TAB + "!A2:C");
  const rows = res.values || [];
  const row = rows.find((r) => +r[0] === clientId);
  if (!row || !row[2]) return null;
  try { return JSON.parse(row[2]); } catch (e) { return null; }
}

// Finds this client's existing row (if any) and updates just that row, or appends a new
// one — never touches any other client's row, unlike WealthCRM's bulk clear+rewrite (which
// is safe there only because it always holds every client in memory at once; WealthOS doesn't).
async function gSaveClientState(clientId, state) {
  const res = await gFetch("https://sheets.googleapis.com/v4/spreadsheets/" + G.sheet + "/values/" + WOS_TAB + "!A2:C");
  const rows = res.values || [];
  const idx = rows.findIndex((r) => +r[0] === clientId);
  const rowValues = [clientId, new Date().toISOString(), JSON.stringify(state)];
  if (idx === -1) {
    await gFetch("https://sheets.googleapis.com/v4/spreadsheets/" + G.sheet + "/values/" + WOS_TAB + "!A2:C:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS", {
      method: "POST",
      body: JSON.stringify({ values: [rowValues] }),
    });
  } else {
    const rowNum = idx + 2; // range starts at row 2, array is 0-indexed
    await gFetch("https://sheets.googleapis.com/v4/spreadsheets/" + G.sheet + "/values/" + WOS_TAB + "!A" + rowNum + ":C" + rowNum + "?valueInputOption=RAW", {
      method: "PUT",
      body: JSON.stringify({ values: [rowValues] }),
    });
  }
}

/* ══════════════════════════════════════════════════════════════
   Data-binding helpers.
   Inputs carry data-bind="dot.path.to.field" (supports array indices,
   e.g. "income.2.amount"). A delegated 'change' listener on #viewInner
   updates STATE then re-renders the current section. 'change' (not
   'input') is used deliberately so the field doesn't lose focus mid-keystroke.
   ══════════════════════════════════════════════════════════════ */
function getPath(obj, path) {
  return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, value) {
  const parts = path.split(".");
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = value;
}
/* paths starting "calc:" bind to CALC_INPUTS (the loan/endowment scratch
   calculators) instead of the client's STATE */
function resolveRoot(path) {
  if (path.indexOf("calc:") === 0) return [CALC_INPUTS, path.slice(5)];
  return [STATE, path];
}

function numField(path, opts) {
  opts = opts || {};
  const [root, p] = resolveRoot(path);
  const v = getPath(root, p);
  const prefix = opts.prefix ? '<span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--subtext);font-size:11.5px;pointer-events:none;">' + opts.prefix + '</span>' : "";
  const suffix = opts.suffix ? '<span style="position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--subtext);font-size:10.5px;pointer-events:none;">' + opts.suffix + '</span>' : "";
  const pad = opts.prefix ? "padding-left:22px;" : opts.suffix ? "padding-right:26px;" : "";
  return '<div style="position:relative;">' + prefix +
    '<input type="number" class="wos-input tabular-nums" style="' + pad + '" step="' + (opts.step || 1) + '" data-bind="' + path + '" data-kind="num" value="' + (Number.isFinite(v) ? v : 0) + '">' +
    suffix + '</div>';
}
function pctField(path) {
  const [root, p] = resolveRoot(path);
  const v = getPath(root, p);
  return '<div style="position:relative;"><input type="number" class="wos-input tabular-nums" style="padding-right:26px;" step="0.1" data-bind="' + path + '" data-kind="pct" value="' + (+(v * 100).toFixed(4)) + '">' +
    '<span style="position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--subtext);font-size:10.5px;pointer-events:none;">%</span></div>';
}
function textField(path, opts) {
  opts = opts || {};
  const [root, p] = resolveRoot(path);
  const v = getPath(root, p) || "";
  return '<input type="' + (opts.type || "text") + '" class="wos-input" data-bind="' + path + '" data-kind="text" value="' + escHtml(v) + '">';
}
function selectField(path, options) {
  const [root, p] = resolveRoot(path);
  const v = getPath(root, p);
  return '<select class="wos-input" data-bind="' + path + '" data-kind="text">' +
    options.map((o) => '<option value="' + o + '"' + (o === v ? " selected" : "") + '>' + o + '</option>').join("") +
    '</select>';
}
function boolField(path, labels) {
  labels = labels || ["Yes", "No"];
  const [root, p] = resolveRoot(path);
  const v = !!getPath(root, p);
  return '<select class="wos-input" data-bind="' + path + '" data-kind="bool">' +
    '<option value="true"' + (v ? " selected" : "") + '>' + labels[0] + '</option>' +
    '<option value="false"' + (!v ? " selected" : "") + '>' + labels[1] + '</option>' +
    '</select>';
}
function field(label, inner) {
  return '<div class="field"><label>' + label + '</label>' + inner + '</div>';
}
function kpi(label, value, sub, tone) {
  const toneCls = tone === "pos" ? "text-pos" : tone === "neg" ? "text-neg" : tone === "accent" ? "text-accent" : "";
  return '<div class="kpi"><div class="l">' + label + '</div><div class="v ' + toneCls + '">' + value + '</div>' + (sub ? '<div class="s">' + sub + '</div>' : "") + '</div>';
}
function sectionHd(icon, title) { return '<div class="section-hd">' + (icon ? "<span>" + icon + "</span>" : "") + '<h2>' + title + '</h2></div>'; }
function pageHd(title, subtitle, right) {
  return '<div class="page-hd"><div><h1>' + title + '</h1>' + (subtitle ? "<p>" + subtitle + "</p>" : "") + '</div>' + (right || "") + '</div>';
}
function pill(status) {
  const good = ["Healthy", "Good", "Adequate", "Solvent", "Adequate"];
  const ok = ["Improve", "High", "Low", "Moderate", "Review"];
  const cls = good.indexOf(status) >= 0 ? "wos-pill-green" : ok.indexOf(status) >= 0 ? "wos-pill-amber" : "wos-pill-red";
  return '<span class="wos-pill ' + cls + '">' + status + '</span>';
}

document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-bind]");
  if (!el || !STATE) return;
  const path = el.dataset.bind, kind = el.dataset.kind;
  const [root, p] = resolveRoot(path);
  let value = el.value;
  if (kind === "num") value = value === "" ? 0 : Number(value);
  else if (kind === "numraw") value = value === "" ? 0 : Number(value);
  else if (kind === "pct") value = (value === "" ? 0 : Number(value)) / 100;
  else if (kind === "bool") value = value === "true";
  setPath(root, p, value);
  rerender();
});

/* ─── SVG chart helpers (ported from GenerateReport.tsx's donutSvg/barsSvg) ─── */
const PALETTE = ["#4f8ef7", "#22c55e", "#eab308", "#a855f7", "#ef4444", "#06b6d4", "#f97316", "#14b8a6"];
function donutSvg(slices, centerTop, centerBottom) {
  const total = slices.reduce((s, x) => s + x.value, 0) || 1;
  const r = 78, ir = 52, cx = 100, cy = 100;
  let a0 = -Math.PI / 2;
  const paths = slices.filter((s) => s.value > 0).map((s) => {
    const a1 = a0 + (s.value / total) * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const xi1 = cx + ir * Math.cos(a1), yi1 = cy + ir * Math.sin(a1);
    const xi0 = cx + ir * Math.cos(a0), yi0 = cy + ir * Math.sin(a0);
    const d = "M" + x0 + " " + y0 + " A" + r + " " + r + " 0 " + large + " 1 " + x1 + " " + y1 + " L" + xi1 + " " + yi1 + " A" + ir + " " + ir + " 0 " + large + " 0 " + xi0 + " " + yi0 + " Z";
    a0 = a1;
    return '<path d="' + d + '" fill="' + s.color + '" opacity="0.92"/>';
  }).join("");
  const legend = slices.map((s) => '<div style="display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:8px;font-size:12px;"><span style="width:11px;height:11px;border-radius:3px;background:' + s.color + ';"></span><span style="color:var(--subtext);">' + s.label + '</span><span class="tabular-nums" style="font-weight:600;">' + ((s.value / total) * 100).toFixed(1) + '%</span></div>').join("");
  return '<div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px;"><svg viewBox="0 0 200 200" width="200" height="200">' + paths +
    '<text x="100" y="94" text-anchor="middle" fill="var(--subtext)" font-size="10" style="text-transform:uppercase;letter-spacing:1px">' + centerTop + '</text>' +
    '<text x="100" y="114" text-anchor="middle" fill="var(--foreground)" font-size="15" font-weight="700">' + centerBottom + '</text></svg>' +
    '<div style="display:grid;gap:6px;width:100%;max-width:240px;">' + legend + '</div></div>';
}
/* Simple two-series line chart (outstanding balance over time), used by the
   Loan Prepayment / Rate Change calculators — no chart library, just SVG. */
function lineSvg(seriesA, seriesB, labelA, labelB) {
  const w = 640, h = 230, padL = 56, padB = 26, padT = 14, padR = 14;
  const maxLen = Math.max(seriesA.length, seriesB ? seriesB.length : 0);
  const vals = seriesA.map((d) => d.balance).concat((seriesB || []).map((d) => d.balance));
  const maxVal = Math.max.apply(null, vals.concat([1]));
  const x = (i) => padL + (maxLen <= 1 ? 0 : (i / (maxLen - 1)) * (w - padL - padR));
  const y = (v) => padT + (1 - v / maxVal) * (h - padT - padB);
  const pathFor = (series) => series.map((d, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(d.balance).toFixed(1)).join(" ");
  const gridY = [0, 0.25, 0.5, 0.75, 1].map((f) => {
    const v = maxVal * (1 - f), yy = padT + f * (h - padT - padB);
    return '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w - padR) + '" y2="' + yy + '" stroke="var(--border)" stroke-width="1"/>' +
      '<text x="' + (padL - 8) + '" y="' + (yy + 4) + '" text-anchor="end" fill="var(--subtext)" font-size="10">' + fmtCr(v) + '</text>';
  }).join("");
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="230" preserveAspectRatio="xMinYMin meet">' + gridY +
    '<path d="' + pathFor(seriesA) + '" fill="none" stroke="var(--subtext)" stroke-width="2"/>' +
    (seriesB ? '<path d="' + pathFor(seriesB) + '" fill="none" stroke="var(--accent)" stroke-width="2"/>' : "") +
    '</svg>' +
    '<div style="display:flex;gap:18px;justify-content:center;margin-top:6px;font-size:11.5px;">' +
    '<span><span style="display:inline-block;width:10px;height:10px;background:var(--subtext);border-radius:2px;margin-right:6px;"></span>' + labelA + '</span>' +
    (seriesB ? '<span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:6px;"></span>' + labelB + '</span>' : "") +
    '</div>';
}
function barsSvg(bars, opts) {
  opts = opts || {};
  const w = opts.width || 520, h = 26, gap = 10, labelW = 150, valW = 100;
  const max = Math.max.apply(null, bars.map((b) => Math.abs(b.value)).concat([1]));
  const chartW = w - labelW - valW - 20;
  const total = h * bars.length + gap * (bars.length - 1) + 16;
  const fmt = opts.format || ((n) => n.toLocaleString("en-IN"));
  const rows = bars.map((b, i) => {
    const y = 8 + i * (h + gap);
    const bw = Math.max(2, (Math.abs(b.value) / max) * chartW);
    const color = b.color || (b.value >= 0 ? "#22c55e" : "#ef4444");
    return '<text x="0" y="' + (y + 17) + '" fill="var(--subtext)" font-size="11.5">' + b.label + '</text>' +
      '<rect x="' + labelW + '" y="' + (y + 3) + '" width="' + chartW + '" height="' + (h - 6) + '" fill="rgba(148,163,184,0.10)" rx="4"/>' +
      '<rect x="' + labelW + '" y="' + (y + 3) + '" width="' + bw + '" height="' + (h - 6) + '" fill="' + color + '" rx="4"/>' +
      '<text x="' + (w - 4) + '" y="' + (y + 17) + '" text-anchor="end" fill="var(--foreground)" font-size="11.5" font-weight="600">' + fmt(b.value) + '</text>';
  }).join("");
  return '<svg viewBox="0 0 ' + w + ' ' + total + '" width="100%" height="' + total + '" preserveAspectRatio="xMinYMin meet" style="display:block">' + rows + '</svg>';
}
function statCardsHtml(cards) {
  return '<div class="grid4">' + cards.map((c) => {
    const toneCls = c.tone === "pos" ? "text-pos" : c.tone === "neg" ? "text-neg" : c.tone === "accent" ? "text-accent" : "";
    return '<div class="kpi"><div class="l">' + c.label + '</div><div class="v ' + toneCls + '">' + c.value + '</div>' + (c.sub ? '<div class="s">' + c.sub + '</div>' : "") + '</div>';
  }).join("") + '</div>';
}

function renderDashboard() {
  const c = compute(STATE);

  let html = pageHd("Dashboard", "Snapshot for " + (STATE.profile.name || "New Client") + " · Age " + c.age + " · " + STATE.profile.taxRegime);

}
function renderDashTab(tab, c) {
  if (tab === "Overview") {
    return statCardsHtml([
      { label: "Net Worth", value: fmtCr(c.netWorth), sub: "Assets − Liabilities", tone: "accent" },
      { label: "Total Assets", value: fmtCr(c.totalAssets), sub: "All categories", tone: "pos" },
      { label: "Total Liabilities", value: fmtCr(c.totalLiabilities), sub: "Outstanding loans", tone: "neg" },
      { label: "True Monthly Surplus", value: fmtINR(c.trueSurplusMonthly), sub: "After tax, EPF, NPS, PT, expenses", tone: c.trueSurplusMonthly >= 0 ? "pos" : "neg" },
    ]) + '<div style="height:12px;"></div>' + statCardsHtml([
      { label: "Gross Monthly Income", value: fmtINR(c.grossMonthly) },
      { label: "Total Expenses / mo", value: fmtINR(c.totalExpMonthly), tone: "neg" },
      { label: "Interest Payable on Loans", value: fmtCr(c.totalInterestPayable), sub: "Sum over remaining tenure", tone: "neg" },
      { label: "Recommended Life Cover", value: fmtCr(c.recommendedCover), sub: STATE.termInsurance.method },
    ]) + sectionHd("💎", "Key Financial Metrics") +
      '<div class="wos-card"><table class="wos-table"><tbody>' +
      '<tr><td>Gross Monthly Income</td><td class="num tabular-nums">' + fmtINR(c.grossMonthly) + '</td></tr>' +
      '<tr><td>Net Monthly Income</td><td class="num tabular-nums">' + fmtINR(c.netMonthly) + '</td></tr>' +
      '<tr><td>Retirement Corpus Required</td><td class="num tabular-nums">' + fmtCr(c.corpusRequired) + '</td></tr>' +
      '<tr><td>Life Cover Recommended</td><td class="num tabular-nums">' + fmtCr(c.recommendedCover) + ' <span style="color:var(--subtext);font-size:11px;">(' + STATE.termInsurance.method + ')</span></td></tr>' +
      '<tr><td>Effective Tax Rate (New Regime)</td><td class="num tabular-nums">' + fmtPct(c.effRate) + '</td></tr>' +
      '</tbody></table></div>';
  }
  if (tab === "Cash Flow") {
    const line = (label, value, sign, tone, bold) => {
      const toneCls = tone === "neg" ? "text-neg" : tone === "pos" ? "text-pos" : "";
      return '<tr' + (bold ? ' style="background:var(--card2);font-weight:600;"' : "") + '><td>' + label + '</td><td class="num" style="color:var(--subtext);font-size:11px;width:24px;">' + sign + '</td><td class="num tabular-nums ' + toneCls + '">' + fmtINR(value) + '</td></tr>';
    };
    return sectionHd("💸", "Cash Flow Summary (Monthly)") +
      '<div class="wos-card" style="padding:0;overflow:hidden;"><table class="wos-table"><tbody>' +
      line("Gross Monthly Income", c.grossMonthly, "+", "pos", true) +
      line("Income Tax", c.annualIncomeTax / 12, "−", "neg") +
      line("Professional Tax", c.profTaxMonthly, "−", "neg") +
      line("EPF (Employee contribution)", c.epfEmpMonthly, "−", "neg") +
      line("NPS Tier-I contribution", c.npsEmpMonthly, "−", "neg") +
      line("Net Take-Home", c.netMonthly, "=", "", true) +
      line("Fixed Expenses", c.fixedMonthly, "−", "neg") +
      line("Variable Expenses", c.varMonthly, "−", "neg") +
      '<tr style="background:var(--card2);font-weight:700;border-top:2px solid var(--accent);"><td>True Monthly Surplus</td><td class="num" style="color:var(--subtext);font-size:11px;">=</td><td class="num tabular-nums ' + (c.trueSurplusMonthly >= 0 ? "text-pos" : "text-neg") + '" style="font-size:16px;">' + fmtINR(c.trueSurplusMonthly) + '</td></tr>' +
      '</tbody></table></div>' +
      '<div class="grid3" style="margin-top:14px;">' +
      kpi("Annualised Surplus", fmtINR(c.trueSurplusMonthly * 12), "", c.trueSurplusMonthly >= 0 ? "pos" : "neg") +
      kpi("Savings Rate", fmtPct(c.savingsRate), "Of net take-home") +
      kpi("Expense Ratio", fmtPct(c.expenseRatio), "Of net take-home") + '</div>';
  }
  if (tab === "Financial Ratios") {
    const rate = (s) => (s >= 0.4 ? "Healthy" : s >= 0.3 ? "Improve" : "Critical");
    const exp = (r) => (r <= 0.5 ? "Good" : r <= 0.7 ? "High" : "Overspending");
    const dbt = (r) => (r < 0.35 ? "Healthy" : r < 0.5 ? "High" : "Critical");
    const sol = (r) => (r >= 0.5 ? "Solvent" : r >= 0.2 ? "Review" : "At Risk");
    const lev = (r) => (r < 0.3 ? "Good" : r < 0.5 ? "Moderate" : "High Leverage");
    const row = (name, value, ideal, status) => '<tr><td>' + name + '</td><td class="num tabular-nums" style="font-weight:600;">' + value + '</td><td style="color:var(--subtext);font-size:11px;">' + ideal + '</td><td>' + pill(status) + '</td></tr>';

      row("Savings Rate", fmtPct(c.savingsRate), "≥40% Healthy · 30% OK · <20% Critical", rate(c.savingsRate)) +
      row("Expense Ratio", fmtPct(c.expenseRatio), "≤50% Good · ≤70% High · >70% Overspending", exp(c.expenseRatio)) +
      row("Emergency Fund Required", fmtINR(c.emergencyRequired), "6 / 9 / 12 mo essential expenses", c.emergencyStatus) +
      row("Debt Service Ratio", fmtPct(c.debtServiceRatio), "<35% annual debt / net income", dbt(c.debtServiceRatio)) +
      row("Solvency Ratio", c.solvencyRatio.toFixed(2), ">0.5 (Net Worth / Assets)", sol(c.solvencyRatio)) +
      row("Debt / Assets Ratio", fmtPct(c.debtAssetRatio), "<30% Good · <50% Moderate", lev(c.debtAssetRatio)) +
      '</tbody></table></div>';
  }
  if (tab === "Asset Allocation") {
    const debtLike = c.totalLiquid + c.totalSchemes + STATE.epf.balance + STATE.nps.tier1Bal + STATE.nps.tier2Bal + c.totalDebtAssets;
    const data = [
      { label: "Equity & MF", value: c.totalEquity, color: PALETTE[0] },
      { label: "Debt / Cash", value: debtLike, color: PALETTE[1] },
      { label: "Gold / Commodities", value: c.totalCommodities, color: PALETTE[2] },
      { label: "Real Estate", value: c.totalRealEstate, color: PALETTE[3] },
      { label: "Other", value: c.totalOther, color: PALETTE[4] },
    ];
    const total = data.reduce((s, d) => s + d.value, 0) || 1;
    const r = STATE.riskProfile;
    const cmp = [
      { label: "Equity — Target " + (r.targetEquity * 100).toFixed(0) + "%", value: (c.totalEquity / total) * 100, color: PALETTE[0] },
      { label: "Debt — Target " + (r.targetDebt * 100).toFixed(0) + "%", value: (debtLike / total) * 100, color: PALETTE[1] },
      { label: "Gold — Target " + (r.targetGold * 100).toFixed(0) + "%", value: (c.totalCommodities / total) * 100, color: PALETTE[2] },
    ];
    return '<div class="grid2">' +
      '<div class="wos-card"><div class="wos-section-title">Current Allocation</div>' + donutSvg(data, "Total", fmtCr(total)) + '</div>' +
      '<div class="wos-card"><div class="wos-section-title">Actual Allocation vs Target (%)</div>' + barsSvg(cmp, { format: (n) => n.toFixed(1) + "%" }) + '</div>' +
      '</div>';
  }
  if (tab === "MF Analysis") {
    const rows = STATE.investmentPortfolio;
    const total = rows.reduce((s, r) => s + r.currentValue, 0);
    const catMap = {};
    rows.forEach((r) => { catMap[r.category || "Uncategorised"] = (catMap[r.category || "Uncategorised"] || 0) + r.currentValue; });
    const cats = Object.keys(catMap).map((name, i) => ({ label: name, value: catMap[name], color: PALETTE[i % PALETTE.length] }));
    let t = '<div class="wos-card" style="padding:0;overflow:hidden;margin-bottom:14px;"><table class="wos-table"><thead><tr><th>Scheme</th><th>Category</th><th class="num">Current Value</th><th class="num">% of Portfolio</th></tr></thead><tbody>';
    if (rows.length === 0) t += '<tr><td colspan="4" style="text-align:center;color:var(--subtext);padding:16px;">No holdings yet — add them in Investment Proposal.</td></tr>';
    rows.forEach((r) => { t += '<tr><td>' + escHtml(r.scheme) + '</td><td>' + escHtml(r.category) + '</td><td class="num tabular-nums">' + fmtINR(r.currentValue) + '</td><td class="num tabular-nums">' + (total === 0 ? "—" : fmtPct(r.currentValue / total)) + '</td></tr>'; });
    if (rows.length > 0) t += '<tr style="background:var(--card2);font-weight:600;"><td colspan="2">TOTAL</td><td class="num tabular-nums">' + fmtINR(total) + '</td><td class="num">100%</td></tr>';
    t += '</tbody></table></div>';
    if (cats.length > 0) t += '<div class="wos-card"><div class="wos-section-title">Category Split</div>' + donutSvg(cats, "Total", fmtCr(total)) + '</div>';
    return t;
  }
  return "";
}

/* Retirement goals pull from the real Retirement calculator (compute()'s
   corpus/EPF/NPS/step-up SIP engine) instead of the generic goal formula —
   it's the same underlying need, just surfaced inside Goal Planning too. */
function goalMetrics(g, c) {
  if (g.type === "retirement") {
    const mapped = c.epfCorpus + c.npsCorpusAt60;
    return { req: c.corpusRequired, mapped, ratio: c.corpusRequired > 0 ? Math.min(1, mapped / c.corpusRequired) : 1, sip: c.sipStepUp, isRetirement: true };
  }
  return { req: requiredFV(g), mapped: fvOfMapped(g), ratio: achievedRatioG(g), sip: requiredMonthlySIP_G(g), isRetirement: false };
}

  html += '</tbody></table></div>';

      '<td>' + textField("sipPortfolio." + i + ".category") + '</td>' +
      '<td>' + numField("sipPortfolio." + i + ".currentAmount", { prefix: "₹" }) + '</td>' +
      '<td>' + numField("sipPortfolio." + i + ".suggestedAmount", { prefix: "₹" }) + '</td>' +

  }
  return html;
}

const CALC_TABS = [

  { id: "prepay", label: "Loan Prepayment" }, { id: "ratechange", label: "Loan Rate Change" }, { id: "endowment", label: "Endowment" },
];
function renderCalculators() {
  let html = pageHd("Calculators", "Deep-dive tools, all driven from this client's profile and cash flows.");

}

function renderCalcTab(tab) {

  if (tab === "retirement") {
    publishSnapshot("retirement", c);
    const projRow = (r) => '<tr><td>' + r.age + '</td><td>' + r.year + '</td><td class="num tabular-nums">' + fmtINR(r.monthly) + '</td><td class="num tabular-nums">' + fmtINR(r.annual) + '</td><td class="num tabular-nums" style="font-weight:600;">' + fmtINR(r.fv) + '</td></tr>';
    return statCardsHtml([
      { label: "Years to Retirement", value: c.yrsToRet },
      { label: "Expenses Today (/yr)", value: fmtINR(c.currentAnnualExp) },
      { label: "Expenses at Retirement (/yr)", value: fmtINR(c.expAtRet), tone: "neg" },
      { label: "Corpus Required", value: fmtCr(c.corpusRequired), tone: "accent" },
    ]) + '<div class="grid2" style="margin-top:14px;align-items:start;">' +
      '<div class="wos-card">' + sectionHd("🎯", "Inputs") + '<div class="grid2">' +
        field("Inflation after Ret.", pctField("retirement.inflationAfter")) + field("Returns after Ret.", pctField("retirement.returnAfter")) +
        '</div><table class="wos-table" style="margin-top:12px;"><tbody>' +
        '<tr><td>Pre-Retirement Inflation</td><td class="num tabular-nums">' + fmtPct(STATE.assumptions.inflation) + '</td></tr>' +
        '<tr><td>Life Expectancy after Ret.</td><td class="num tabular-nums">' + STATE.profile.lifeExpAfterRet + ' yrs</td></tr>' +
        '<tr><td>Expenses at Retirement (before rental offset)</td><td class="num tabular-nums">' + fmtINR(c.expenseAtRet) + '</td></tr>' +
        '<tr><td>Less: Rental Income at Retirement (@ ' + fmtPct(STATE.assumptions.rentalGrowth) + ' growth)</td><td class="num tabular-nums">' + fmtINR(c.rentalAtRet) + '</td></tr>' +
        '</tbody></table><p style="font-size:10.5px;color:var(--subtext);margin-top:8px;line-height:1.5;">Assumes today\'s rental income (' + fmtINR(c.rentalAnnual) + '/yr) continues into retirement and grows at the rate set above — not necessarily the same as general inflation. Never reduces the requirement below zero.</p></div>' +
      '<div class="wos-card">' + sectionHd("📈", "Corpus Summary") + '<table class="wos-table"><tbody>' +
        '<tr><td>EPF Corpus at Retirement</td><td class="num tabular-nums">' + fmtINR(c.epfCorpus) + '</td></tr>' +
        '<tr><td>NPS Corpus at Age 60</td><td class="num tabular-nums">' + fmtINR(c.npsCorpusAt60) + '</td></tr>' +
        '<tr><td>Corpus Required</td><td class="num tabular-nums">' + fmtINR(c.corpusRequired) + '</td></tr>' +
        '<tr style="font-weight:600;"><td>Shortfall</td><td class="num tabular-nums ' + (c.shortfall > 0 ? "text-neg" : "text-pos") + '">' + fmtINR(c.shortfall) + '</td></tr>' +
        '</tbody></table></div>' +
      '</div>' +
      sectionHd("💡", "SIP Required to Bridge the Gap") +
      '<div class="grid2">' +
      '<div class="wos-card"><div class="wos-section-title">Without Step-Up</div><div style="font-size:24px;font-weight:600;" class="tabular-nums">' + fmtINR(c.sipNoStepUp) + '<span style="font-size:12px;color:var(--subtext);margin-left:8px;">/ month</span></div><p style="font-size:11.5px;color:var(--subtext);margin-top:8px;">Flat SIP @ ' + fmtPct(STATE.assumptions.equityReturn) + ' for ' + c.yrsToRet + ' years.</p></div>' +
      '<div class="wos-card"><div class="wos-section-title">With Annual Step-Up</div><div style="font-size:24px;font-weight:600;" class="tabular-nums text-accent">' + fmtINR(c.sipStepUp) + '<span style="font-size:12px;color:var(--subtext);margin-left:8px;">/ month (year 1)</span></div><p style="font-size:11.5px;color:var(--subtext);margin-top:8px;">Increases by ' + fmtPct(STATE.assumptions.sipStepUp) + ' every year.</p></div>' +
      '</div>' +
      sectionHd("📊", "EPF Projection") +
      '<div class="wos-card" style="padding:0;overflow:auto;max-height:360px;"><table class="wos-table"><thead style="position:sticky;top:0;background:var(--card);"><tr><th>Age</th><th>Year</th><th class="num">Monthly</th><th class="num">Annual</th><th class="num">Future Value</th></tr></thead><tbody>' +
      c.epfProj.map(projRow).join("") + '</tbody></table></div>' +
      sectionHd("📊", "NPS Projection") +
      '<div class="wos-card" style="padding:0;overflow:auto;max-height:360px;"><table class="wos-table"><thead style="position:sticky;top:0;background:var(--card);"><tr><th>Age</th><th>Year</th><th class="num">Monthly</th><th class="num">Annual</th><th class="num">Future Value</th></tr></thead><tbody>' +
      c.npsProj.map(projRow).join("") + '</tbody></table></div>';
  }

  if (tab === "insurance") {
    publishSnapshot("insurance", c);
    const method = STATE.termInsurance.method;
    return statCardsHtml([
      { label: "HLV Cover Needed", value: fmtCr(c.hlvCoverNeeded), tone: "accent" },
      { label: "Need-Based Cover", value: fmtCr(c.needBasedCover), tone: "accent" },
      { label: "Recommended (active)", value: fmtCr(c.recommendedCover), tone: "pos", sub: method },
      { label: "Existing Cover", value: fmtINR(STATE.termInsurance.existingCover) },
    ]) + '<div style="height:10px;"></div>' +
    '<div class="wos-card"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">' +
    '<label style="font-size:11px;color:var(--subtext);font-weight:600;text-transform:uppercase;letter-spacing:.6px;">Active Method</label>' +
    '<div style="width:200px;">' + selectField("termInsurance.method", ["HLV", "Need-Based"]) + '</div>' +
    '<div style="margin-left:auto;font-size:11.5px;color:var(--subtext);">HLV = Income replacement · Need-Based = Comprehensive goals</div>' +
    '</div></div>' +
    '<div class="grid2" style="margin-top:14px;align-items:start;">' +
      '<div class="wos-card">' + sectionHd("📋", "HLV Method") +
        '<table class="wos-table"><tbody>' +
        '<tr><td>Current Annual Net Income</td><td class="num tabular-nums">' + fmtINR(c.netAnnual) + '</td></tr>' +
        '<tr><td>Personal Expenses (~30%)</td><td class="num tabular-nums">' + fmtINR(c.netAnnual * 0.3) + '</td></tr>' +
        '<tr><td>Net for Family</td><td class="num tabular-nums">' + fmtINR(c.netAnnual * 0.7) + '</td></tr>' +
        '<tr><td>Working Years Remaining</td><td class="num tabular-nums">' + c.yrsToRet + '</td></tr>' +
        '<tr><td>Discount Rate</td><td class="num">' + pctField("termInsurance.discountHLV") + '</td></tr>' +
        '<tr><td>Existing Life Cover</td><td class="num">' + numField("termInsurance.existingCover", { prefix: "₹" }) + '</td></tr>' +
        '</tbody></table>' +
        '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);text-align:right;">' +
        '<div style="font-size:11px;color:var(--subtext);">HLV (PV of growing annuity)</div><div style="font-size:18px;font-weight:600;" class="tabular-nums">' + fmtINR(c.hlv) + '</div>' +
        '<div style="font-size:11px;color:var(--subtext);margin-top:8px;">Less assets · Less existing</div><div style="font-size:20px;font-weight:600;" class="tabular-nums text-accent">' + fmtCr(c.hlvCoverNeeded) + '</div>' +
        '</div></div>' +
      '<div class="wos-card">' + sectionHd("📋", "Need-Based Method") +
        '<table class="wos-table"><tbody>' +
        '<tr><td>Annual Family Expenses</td><td class="num tabular-nums">' + fmtINR(c.currentAnnualExp) + '</td></tr>' +
        '<tr><td>Income Replacement Period</td><td class="num tabular-nums">' + c.yrsToRet + ' yrs</td></tr>' +
        '<tr><td>Outstanding Loans</td><td class="num tabular-nums">' + fmtINR(c.totalLiabilities) + '</td></tr>' +
        '<tr><td>Children\'s Education</td><td class="num">' + numField("termInsurance.childEdu", { prefix: "₹" }) + '</td></tr>' +
        '<tr><td>Children\'s Marriage</td><td class="num">' + numField("termInsurance.childMarriage", { prefix: "₹" }) + '</td></tr>' +
        '<tr><td>Other Goals</td><td class="num">' + numField("termInsurance.otherGoals", { prefix: "₹" }) + '</td></tr>' +
        '<tr><td>Discount Rate</td><td class="num">' + pctField("termInsurance.discountNeed") + '</td></tr>' +
        '<tr><td>Less: Investable Assets</td><td class="num tabular-nums">' + fmtINR(c.investable) + '</td></tr>' +
        '</tbody></table>' +
        '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);text-align:right;">' +
        '<div style="font-size:11px;color:var(--subtext);">Gross Need</div><div style="font-size:18px;font-weight:600;" class="tabular-nums">' + fmtINR(c.grossNeed) + '</div>' +
        '<div style="font-size:11px;color:var(--subtext);margin-top:8px;">Net Insurance Need</div><div style="font-size:20px;font-weight:600;" class="tabular-nums text-gold">' + fmtCr(c.needBasedCover) + '</div>' +
        '</div></div>' +
    '</div>';
  }

  if (tab === "sip") {
    const ci = CALC_INPUTS.sip;
    /* Exact port of SipCompare.tsx's fvSip — an annual lump-sum, mid-year-compounding
       approximation. Deliberately NOT the monthly-annuity formula used elsewhere
       (goals.ts) — this is what the original SIP Compare screen actually used. */
    const fvSipOriginal = (monthly, years, ret, stepUp) => {
      const yrs = Math.max(0, Math.round(years));
      let fv = 0, invested = 0;
      for (let k = 0; k < yrs; k++) {
        const m = monthly * Math.pow(1 + stepUp, k);
        const yrInv = m * 12;
        invested += yrInv;
        fv += yrInv * Math.pow(1 + ret, yrs - k - 0.5);
      }
      return { fv, invested, gain: fv - invested };
    };
    const ret = ci.ret / 100, stepUp = ci.stepUp / 100;
    const constant = fvSipOriginal(ci.monthly, ci.years, ret, 0);
    const stepped = fvSipOriginal(ci.monthly, ci.years, ret, stepUp);
    const advantage = stepped.fv - constant.fv;
    publishSnapshot("sip", { inputs: ci, constant, stepped, advantage });
    return '<div class="wos-card">' + sectionHd("📈", "Inputs") + '<div class="grid4">' +
      field("Starting Monthly SIP", numField("calc:sip.monthly", { prefix: "₹" })) +
      field("Duration (years)", numField("calc:sip.years", { step: 1 })) +
      field("Expected Return", pctSimpleField("calc:sip.ret")) +
      field("Annual Step-Up", pctSimpleField("calc:sip.stepUp")) +
      '</div></div>' +
      sectionHd("🆚", "Side-by-side") +

      '<div class="wos-card"><div class="wos-section-title">Constant SIP</div><div class="grid3">' +
      kpi("Invested", fmtINR(constant.invested)) + kpi("Gain", fmtINR(constant.gain), "", "accent") + kpi("Future Value", fmtINR(constant.fv), "", "pos") +
      '</div></div>' +
      '<div class="wos-card"><div class="wos-section-title">Step-up SIP</div><div class="grid3">' +
      kpi("Invested", fmtINR(stepped.invested)) + kpi("Gain", fmtINR(stepped.gain), "", "accent") + kpi("Future Value", fmtINR(stepped.fv), "", "pos") +
      '</div></div></div>' +
      '<div style="margin-top:14px;">' + kpi("Step-up Advantage over Constant", fmtINR(advantage), constant.fv > 0 ? (advantage >= 0 ? "+" : "") + ((advantage / constant.fv) * 100).toFixed(1) + "% more corpus" : "", advantage >= 0 ? "pos" : "neg") + '</div>';
  }

  if (tab === "emergency") {
    const ci = CALC_INPUTS.emergency;
    const monthlyOutflow = ci.fixed + ci.variable + ci.emi;
    let months, buffer = 0, rationale = "";
    if (ci.medical === "Yes" && ci.seniorDep === "Yes") { months = 9; buffer = 1500000; rationale = "Medical history + senior-citizen dependent → 9 months of expenses plus a ₹15 lakh medical buffer."; }
    else if (ci.medical === "Yes") { months = 9; buffer = 1000000; rationale = "Medical history flagged → 9 months of expenses plus a ₹10 lakh medical buffer."; }
    else if (ci.dependents >= 2) { months = 12; rationale = "2+ dependents → 12 months of expenses."; }
    else if (ci.dependents === 1) { months = 9; rationale = "1 dependent → 9 months of expenses."; }
    else { months = 6; rationale = "No dependents → 6 months of expenses."; }
    const required = months * monthlyOutflow + buffer;
    const available = ci.cash + ci.fd + ci.liquid;
    const gap = required - available;
    const coverageMonths = monthlyOutflow > 0 ? Math.max(0, available - buffer) / monthlyOutflow : 0;
    publishSnapshot("emergency", { inputs: ci, monthlyOutflow, months, buffer, required, available, gap, rationale, coverageMonths });
    return '<div class="wos-card">' + sectionHd("🧾", "Liquid Assets") + '<div class="grid3">' +
      field("Cash / Bank Balance", numField("calc:emergency.cash", { prefix: "₹" })) +
      field("Fixed Deposits", numField("calc:emergency.fd", { prefix: "₹" })) +
      field("Liquid Funds", numField("calc:emergency.liquid", { prefix: "₹" })) +
      '</div>' + sectionHd("💸", "Monthly Outflows") + '<div class="grid3">' +
      field("Fixed Expenses", numField("calc:emergency.fixed", { prefix: "₹" })) +
      field("Variable Expenses", numField("calc:emergency.variable", { prefix: "₹" })) +
      field("EMI", numField("calc:emergency.emi", { prefix: "₹" })) +
      '</div>' + sectionHd("👨‍👩‍👧", "Household Profile") + '<div class="grid3">' +
      field("Number of Dependents", numField("calc:emergency.dependents", { step: 1 })) +
      field("Medical history not fully covered by insurance?", selectField("calc:emergency.medical", ["No", "Yes"])) +
      field("Is any such dependent a senior citizen?", selectField("calc:emergency.seniorDep", ["No", "Yes"])) +
      '</div></div><div style="height:10px;"></div>' +
      statCardsHtml([
        { label: "Monthly Outflow", value: fmtINR(monthlyOutflow) },
        { label: "Months of Cover Needed", value: months + " mo", sub: buffer > 0 ? "+ " + fmtINR(buffer) + " medical buffer" : "", tone: "accent" },
        { label: "Emergency Fund Required", value: fmtINR(required), tone: "accent" },
        { label: "Currently Available", value: fmtINR(available), sub: "≈ " + coverageMonths.toFixed(1) + " months covered", tone: gap <= 0 ? "pos" : "neg" },
      ]) + '<div class="wos-card" style="margin-top:14px;">' +
      '<div class="wos-section-title">Status</div>' +
      '<div style="font-size:18px;font-weight:600;margin-top:4px;" class="' + (gap <= 0 ? "text-pos" : "text-neg") + '">' + (gap <= 0 ? "Fully funded — surplus of " + fmtINR(-gap) : "Shortfall of " + fmtINR(gap)) + '</div>' +
      '<div style="font-size:12px;color:var(--subtext);margin-top:8px;max-width:600px;">' + rationale + '</div></div>';
  }

  if (tab === "prepay") return renderPrepayCalc();
  if (tab === "ratechange") return renderRateChangeCalc();
  if (tab === "endowment") return renderEndowmentCalc();
  return "";
}

/* ─── Loan Prepayment tab ─── */
function renderPrepayCalc() {
  const ci = CALC_INPUTS.prepay;
  const emi = ci.emiMode === "known" ? ci.knownEMI : calcEMI(ci.originalAmount, ci.rate, ci.originalTenure);
  const result = computePrepayment({ ...ci, emi });
  publishSnapshot("prepay", { inputs: ci, result });
  let html = '<div class="grid4">' +
    field("EMI Source", selectField("calc:prepay.emiMode", ["calculate", "known"])) +
    (ci.emiMode === "calculate" ? field("Original Amount", numField("calc:prepay.originalAmount", { prefix: "₹" })) + field("Original Tenure (mo)", numField("calc:prepay.originalTenure", { step: 1 })) : field("Known EMI", numField("calc:prepay.knownEMI", { prefix: "₹" }))) +
    field("Rate of Interest", pctSimpleField("calc:prepay.rate")) +
    field("Pending Amount", numField("calc:prepay.pendingAmount", { prefix: "₹" })) +
    field("Pending Tenure (mo)", numField("calc:prepay.pendingTenure", { step: 1 })) +
    field("Prepayment?", boolField("calc:prepay.prepayEnabled", ["Yes", "No"])) +
    (ci.prepayEnabled ? field("Frequency", selectField("calc:prepay.prepayFreq", ["one-time", "monthly", "quarterly", "yearly"])) + field("Prepayment Amount", numField("calc:prepay.prepayAmount", { prefix: "₹" })) : "") +
    '</div>';
  if (!result) return html + '<div class="wos-card" style="margin-top:14px;color:var(--subtext);">Enter a pending amount to see results.</div>';
  if (result.base.insufficient) {
    return html + '<div class="wos-card" style="margin-top:14px;color:var(--neg,#c0392b);">This EMI doesn\'t cover the interest at ' + ci.rate + '% — check the EMI or rate entered.</div>';
  }
  html += '<div style="height:10px;"></div>' + statCardsHtml([
    { label: "EMI", value: fmtINR(emi) },
    { label: "Interest (No Prepay)", value: fmtCr(result.base.interest) },
    { label: "Interest (With Prepay)", value: result.prepay ? fmtCr(result.prepay.interest) : "—", tone: "accent" },
    { label: "Interest Saved", value: result.prepay ? fmtCr(result.base.interest - result.prepay.interest) : "—", tone: "pos" },
  ]);
  if (result.prepay) html += '<div class="wos-card" style="margin-top:14px;"><table class="wos-table"><tbody>' +
    '<tr><td>Tenure without prepayment</td><td class="num tabular-nums">' + result.base.months + ' mo</td></tr>' +
    '<tr><td>Tenure with prepayment</td><td class="num tabular-nums">' + result.prepay.months + ' mo</td></tr>' +
    '<tr style="font-weight:700;background:var(--card2);"><td>Tenure Saved</td><td class="num tabular-nums text-pos">' + (result.base.months - result.prepay.months) + ' mo</td></tr>' +
    '</tbody></table></div>';
  html += sectionHd("📉", "Outstanding Balance Over Time") +
    '<div class="wos-card">' + lineSvg(result.base.schedule, result.prepay ? result.prepay.schedule : null, "Without prepayment", "With prepayment") + '</div>';
  return html;
}
function pctSimpleField(path) {
  const [root, p] = resolveRoot(path);
  const v = getPath(root, p);
  return '<div style="position:relative;"><input type="number" class="wos-input tabular-nums" style="padding-right:26px;" step="0.01" data-bind="' + path + '" data-kind="numraw" value="' + v + '">' +
    '<span style="position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--subtext);font-size:10.5px;pointer-events:none;">%</span></div>';
}

/* ─── Loan Rate Change tab ─── */
function renderRateChangeCalc() {
  const ci = CALC_INPUTS.ratechange;
  const oldEMI = ci.emiMode === "known" ? ci.knownEMI : calcEMI(ci.originalAmount, ci.oldRate, ci.originalTenure);
  const result = computeRateChange({ ...ci, oldEMI });
  publishSnapshot("ratechange", { inputs: ci, result });
  let html = '<div class="grid4">' +
    field("EMI Source", selectField("calc:ratechange.emiMode", ["calculate", "known"])) +
    (ci.emiMode === "calculate" ? field("Original Amount", numField("calc:ratechange.originalAmount", { prefix: "₹" })) + field("Original Tenure (mo)", numField("calc:ratechange.originalTenure", { step: 1 })) : field("Known EMI", numField("calc:ratechange.knownEMI", { prefix: "₹" }))) +
    field("Old Rate", pctSimpleField("calc:ratechange.oldRate")) +
    field("New Rate", pctSimpleField("calc:ratechange.newRate")) +
    field("Pending Amount", numField("calc:ratechange.pendingAmount", { prefix: "₹" })) +
    field("Pending Tenure (mo)", numField("calc:ratechange.pendingTenure", { step: 1 })) +
    field("Adjust", selectField("calc:ratechange.mode", ["emi", "tenure"])) +
    '</div>';
  if (!result) return html + '<div class="wos-card" style="margin-top:14px;color:var(--subtext);">Enter a pending amount to see results.</div>';
  if (result.base.insufficient) {
    return html + '<div class="wos-card" style="margin-top:14px;color:var(--neg,#c0392b);">The current EMI doesn\'t cover the interest at ' + ci.oldRate + '% — check the EMI or rate entered.</div>';
  }
  if (result.newRun.insufficient) {
    return html + '<div class="wos-card" style="margin-top:14px;color:var(--neg,#c0392b);">The new EMI doesn\'t cover the interest at ' + ci.newRate + '% — the loan would never pay down. Increase the EMI, or switch "Adjust" to recalculate the EMI for the new rate.</div>';
  }
  const interestSaved = result.base.interest - result.newRun.interest;
  html += '<div style="height:10px;"></div>' + statCardsHtml([
    { label: "Old EMI", value: fmtINR(result.oldEMI) },
    { label: "New EMI", value: fmtINR(result.newEMI), tone: "accent" },
    { label: "New Tenure", value: result.newRun.months + " mo" },
    { label: "Interest " + (interestSaved >= 0 ? "Saved" : "Increase"), value: fmtCr(Math.abs(interestSaved)), tone: interestSaved >= 0 ? "pos" : "neg" },
  ]);
  html += sectionHd("📉", "Outstanding Balance Over Time") +
    '<div class="wos-card">' + lineSvg(result.base.schedule, result.newRun.schedule, "At " + ci.oldRate + "%", "At " + ci.newRate + "%") + '</div>';
  return html;
}

/* ─── Endowment Surrender tab ─── */
function renderEndowmentCalc() {
  const ci = CALC_INPUTS.endowment;
  const term = ci.term;
  const ppt = Math.max(1, Math.min(Math.round(ci.ppt), term));
  const premiumsPaid = Math.max(1, Math.min(Math.round(ci.premiumsPaid), term));
  const inputs = {
    startYear: ci.startYear, term, premiumType: ci.premiumType,
    lastPremiumYear: computeLastPremiumYear(ci.premiumType, ci.startYear, term, ppt),
    sumAssured: ci.sumAssured, annualPremium: ci.annualPremium, accruedBonus: ci.accruedBonus,
    premiumsPaid, surrenderYear: ci.startYear + premiumsPaid - 1, mfReturn: ci.mfReturn,
    knownSurrenderValue: ci.bonusMode === "known" ? ci.knownSV : undefined,
    reinvestSavedPremiums: ci.scenarioMode === "reinvest",
  };
  const result = runEndowmentCalculation(inputs);
  publishSnapshot("endowment", { inputs: { ...inputs, policyName: ci.policyName }, result });
  let html = '<div class="grid4">' +
    field("Policy Name (optional)", textField("calc:endowment.policyName")) +
    field("Start Year", numField("calc:endowment.startYear", { step: 1 })) +
    field("Term (yrs)", numField("calc:endowment.term", { step: 1 })) +
    field("Premiums Paid So Far (yrs)", numField("calc:endowment.premiumsPaid", { step: 1 })) +
    field("Premium Type", selectField("calc:endowment.premiumType", ["regular", "limited", "single"])) +
    (ci.premiumType === "limited" ? field("Premium Payment Tenure", numField("calc:endowment.ppt", { step: 1 })) : "") +
    field("Sum Assured", numField("calc:endowment.sumAssured", { prefix: "₹" })) +
    field("Annual Premium", numField("calc:endowment.annualPremium", { prefix: "₹" })) +
    field("Accrued Bonus", numField("calc:endowment.accruedBonus", { prefix: "₹" })) +
    field("Surrender Value", selectField("calc:endowment.bonusMode", ["calculate", "known"])) +
    (ci.bonusMode === "known" ? field("Known SV", numField("calc:endowment.knownSV", { prefix: "₹" })) : "") +
    field("MF Return", pctSimpleField("calc:endowment.mfReturn")) +
    field("Strategy", selectField("calc:endowment.scenarioMode", ["reinvest", "lumpsum"])) +
    '</div><div style="height:10px;"></div>' +
    statCardsHtml([
      { label: "SSV", value: fmtINR(result.ssv) },
      { label: "GSV", value: result.gsvApplicable ? fmtINR(result.gsv) : "N/A", sub: result.gsvApplicable ? "" : "Not applicable in policy year 1" },
      { label: "Payout if Surrendered", value: fmtCr(result.surrenderValue), tone: "accent" },
      { label: "Maturity Value", value: fmtCr(result.maturity) },
    ]) + '<div style="height:10px;"></div>' + statCardsHtml([
      { label: "Continue IRR", value: result.continueIRR === null ? "—" : fmtPct(result.continueIRR, 2) },
      { label: "Surrender & Invest IRR", value: result.surrenderIRR === null ? "—" : fmtPct(result.surrenderIRR, 2), tone: "accent" },
      { label: "MF Corpus at Maturity", value: fmtCr(result.mfFinalValue) },
      { label: "Recommendation", value: (result.continueIRR !== null && result.surrenderIRR !== null) ? (result.surrenderIRR > result.continueIRR ? "Surrender" : "Continue") : (result.surrenderValue <= 0 ? "Continue" : "—") },
    ]);
  html += sectionHd("📉", "MF Portfolio Growth (After Surrender)") +
    '<div class="wos-card">' + lineSvg(result.rows.map((r) => ({ balance: r.mfBalance })), null, "MF Balance", "") + '</div>';
  return html;
}

/* ══════════════════════════════════════════════════════════════
   Section-level click wiring (tabs, add/remove rows, goal modal)
   ══════════════════════════════════════════════════════════════ */
function wireSectionEvents(id) {
  const root = $("viewInner");

  // Dashboard tabs
  $$('[data-dashtab]', root).forEach((btn) => btn.addEventListener("click", () => {
    CURRENT_DASH_TAB = btn.dataset.dashtab; rerender();
  }));
  // Calculator tabs
  $$('[data-calctab]', root).forEach((btn) => btn.addEventListener("click", () => {
    CURRENT_CALC_TAB = btn.dataset.calctab; rerender();
  }));

  // Generic add/remove row (income, fixedExp, varExp, equity, commodities, realEstate, otherInv, schemes, liabilities, investmentPortfolio, sipPortfolio)
  $$('[data-remove-row]', root).forEach((btn) => btn.addEventListener("click", () => {
    const [listPath, idx] = splitListPath(btn.dataset.removeRow);
    const list = getPath(STATE, listPath);
    list.splice(idx, 1);
    rerender();
  }));
  $$('[data-add-row]', root).forEach((btn) => btn.addEventListener("click", () => {
    const listPath = btn.dataset.addRow;
    const list = getPath(STATE, listPath);
    list.push({ id: uid(), name: "New item", amount: 0, freq: "Monthly", value: 0 });
    rerender();
  }));
  $$('[data-add-scheme-row]', root).forEach((btn) => btn.addEventListener("click", () => {
    STATE.schemes.push({ id: uid(), type: "New Scheme", openDate: "", balance: 0, rate: 0.07, annualContrib: 0, tenureYears: 15 });
    rerender();
  }));
  $$('[data-add-liability-row]', root).forEach((btn) => btn.addEventListener("click", () => {
    STATE.liabilities.push({ id: uid(), name: "New Loan", outstanding: 0, rate: 0.09, emi: 0, manualEMI: 0, tenureMonths: 0, tenureLeftMonths: 0 });
    rerender();
  }));
  $$('[data-add-inv-row]', root).forEach((btn) => btn.addEventListener("click", () => {
    STATE.investmentPortfolio.push({ id: uid(), scheme: "", category: "", currentValue: 0, suggestedValue: 0, action: "Hold", noteText: "", notes: [] });
    rerender();
  }));
  $$('[data-add-sip-row]', root).forEach((btn) => btn.addEventListener("click", () => {
    STATE.sipPortfolio.push({ id: uid(), scheme: "", category: "", currentAmount: 0, suggestedAmount: 0, frequency: "Monthly", action: "Hold", noteText: "", notes: [] });
    rerender();
  }));
  $$('[data-add-stp-row]', root).forEach((btn) => btn.addEventListener("click", () => {
    if (!STATE.stpProposal.rows) STATE.stpProposal.rows = [];
    STATE.stpProposal.rows.push({ id: uid(), sourceFund: "", targetFund: "", amount: 0, frequency: "Monthly", durationMonths: 12, noteText: "" });
    rerender();
  }));

  // Goals
  if (id === "goals") {
    $("btnAddGoal") && $("btnAddGoal").addEventListener("click", () => openGoalModal(newGoal("other")));
    $$('[data-edit-goal]', root).forEach((btn) => btn.addEventListener("click", () => {
      const g = STATE.goals.find((x) => x.id === btn.dataset.editGoal);
      if (g) openGoalModal(g);
    }));
    $$('[data-remove-goal]', root).forEach((btn) => btn.addEventListener("click", () => {
      if (!confirm("Remove this goal?")) return;
      STATE.goals = STATE.goals.filter((x) => x.id !== btn.dataset.removeGoal);
      rerender();
    }));
  }

  if (id === "report") wireReportPicker();
}
function splitListPath(s) {
  const parts = s.split(".");
  const idx = +parts.pop();
  return [parts.join("."), idx];
}

function wireReportPicker() {
  $("btnSelectAllSec") && $("btnSelectAllSec").addEventListener("click", () => { SELECTED_REPORT_SECTIONS = REPORT_SECTIONS.map((s) => s.id); rerender(); });
  $("btnClearSec") && $("btnClearSec").addEventListener("click", () => { SELECTED_REPORT_SECTIONS = REPORT_SECTIONS.filter((s) => s.always).map((s) => s.id); rerender(); });
  $$('[data-report-sec]').forEach((cb) => cb.addEventListener("change", () => {
    const id = cb.dataset.reportSec;
    if (cb.checked) { if (SELECTED_REPORT_SECTIONS.indexOf(id) < 0) SELECTED_REPORT_SECTIONS.push(id); }
    else SELECTED_REPORT_SECTIONS = SELECTED_REPORT_SECTIONS.filter((x) => x !== id);
  }));
  $("btnGenReport") && $("btnGenReport").addEventListener("click", openGeneratedReportInNewTab);
  $("btnDownloadReportHtml") && $("btnDownloadReportHtml").addEventListener("click", () => {
    const html = buildReportHtml();
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Financial-Plan-" + (STATE.profile.name || "client").replace(/\s+/g, "_") + "-" + new Date().toISOString().slice(0, 10) + ".html";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });
}
function openGeneratedReportInNewTab() {
  const html = buildReportHtml();
  const win = window.open("", "_blank");
  if (win) { win.document.write(html); win.document.close(); }
  else alert("Please allow pop-ups to open the report in a new tab.");
}

        const pct = m.req > 0 ? (m.mapped / m.req) * 100 : 100;
        const status = pct >= 100 ? "Adequate" : pct >= 50 ? "Improve" : "Low";
        return [GOAL_META[g.type].icon + " " + escHtml(g.name), GOAL_META[g.type].label, fmtINR(g.goalAmountPV), yearsLeftG(g).toFixed(1), fmtINR(m.req), fmtINR(m.mapped), fmtINR(m.sip), status];
      });
      const overall = totalReq > 0 ? (totalCov / totalReq) * 100 : 0;
      body += repSectionTitle("Goal Planning") + repStatGrid([
        ["Total Goals", String(STATE.goals.length)], ["Combined Target (FV)", fmtINR(totalReq)],
        ["Already Covered", overall.toFixed(1) + "%"], ["Combined Monthly SIP", fmtINR(totalSip)],
      ]) + repTable(["Goal", "Type", "Target (today)", "Yrs Left", "Required FV", "Earmarked", "Monthly SIP", "Status"], rows);
    }
  }
  if (has("retirement")) {
    body += repSectionTitle("Retirement Planning") + repStatGrid([
      ["Corpus Required", fmtCr(c.corpusRequired)], ["EPF at Retirement", fmtCr(c.epfCorpus)],
      ["NPS at 60", fmtCr(c.npsCorpusAt60)], ["Years to Retire", c.yrsToRet + " yrs"],
    ]) + repBars([
      { label: "Required Corpus", value: c.corpusRequired, color: "#4f8ef7" },
      { label: "EPF Projection", value: c.epfCorpus, color: "#22c55e" },
      { label: "NPS Projection", value: c.npsCorpusAt60, color: "#eab308" },
    ], { format: fmtCr }) + repTable(["Item", "Value"], [
      ["Required Monthly SIP (No Step-up)", fmtINR(c.sipNoStepUp)],
      ["Required Monthly SIP (Step-up)", fmtINR(c.sipStepUp)],
    ]);
  }
  if (has("insurance")) {
    const gap = Math.max(0, c.recommendedCover - STATE.termInsurance.existingCover);
    body += repSectionTitle("Term Insurance Need") + repStatGrid([
      ["Method", STATE.termInsurance.method], ["Recommended Cover", fmtCr(c.recommendedCover)],
      ["Existing Cover", fmtCr(STATE.termInsurance.existingCover)], ["Cover Gap", fmtCr(gap)],
    ]) + repBars([
      { label: "Recommended Cover", value: c.recommendedCover, color: "#4f8ef7" },
      { label: "Existing Cover", value: STATE.termInsurance.existingCover, color: "#22c55e" },
      { label: "Cover Gap", value: gap, color: gap > 0 ? "#ef4444" : "#22c55e" },
    ], { format: fmtCr }) + repTable(["Item", "Value"], [
      ["HLV-Based Cover", fmtINR(c.hlvCoverNeeded)], ["Need-Based Cover", fmtINR(c.needBasedCover)],
    ]);
  }
  if (has("tax")) {
    body += repSectionTitle("Tax Summary") + repTable(["Item", "Value"], [
      ["Gross Total Income", fmtINR(c.gti)], ["Taxable Income", fmtINR(c.taxableTotal)],
      ["Tax Payable (" + STATE.profile.taxRegime + ")", fmtINR(c.annualIncomeTax)], ["Effective Rate", fmtPct(c.effRate)],
    ]);
  }
  if (has("emergency")) {
    const s = SNAPSHOTS.emergency;
    if (!s) {
      body += repSectionTitle("Emergency Fund") + '<p style="color:#8fa3c8;font-size:12px;">Open the Emergency Fund calculator once so its inputs are captured, then regenerate the report.</p>';
    } else {
      body += repSectionTitle("Emergency Fund") + repStatGrid([
        ["Monthly Outflow", fmtINR(s.monthlyOutflow)],
        ["Cover Needed", s.months + " mo" + (s.buffer > 0 ? " + " + fmtINR(s.buffer) + " buffer" : "")],
        ["Fund Required", fmtINR(s.required)],
        ["Currently Available", fmtINR(s.available) + " (≈" + s.coverageMonths.toFixed(1) + " mo)"],
      ]) + repTable(["Item", "Value"], [
        ["Cash / Bank", fmtINR(s.inputs.cash)], ["Fixed Deposits", fmtINR(s.inputs.fd)], ["Liquid Funds", fmtINR(s.inputs.liquid)],
        ["Fixed Expenses (mo)", fmtINR(s.inputs.fixed)], ["Variable Expenses (mo)", fmtINR(s.inputs.variable)], ["EMI (mo)", fmtINR(s.inputs.emi)],
        ["Dependents", String(s.inputs.dependents)], ["Medical history uncovered", s.inputs.medical], ["Senior-citizen dependent", s.inputs.seniorDep],
        ["Status", s.gap <= 0 ? "Fully funded (surplus " + fmtINR(-s.gap) + ")" : "Shortfall of " + fmtINR(s.gap)],
      ]) + '<p style="color:#8fa3c8;font-size:11.5px;margin-top:8px;">' + escHtml(s.rationale) + '</p>';
    }
  }
  if (has("investments")) {
    const lumpRows = STATE.investmentPortfolio.map((r) => [escHtml(r.scheme), escHtml(r.category), fmtINR(r.currentValue), fmtINR(r.suggestedValue), r.action]);
    const sipRows = (STATE.sipPortfolio || []).map((r) => [escHtml(r.scheme), escHtml(r.category), fmtINR(r.currentAmount), fmtINR(r.suggestedAmount), r.frequency, r.action]);
    body += repSectionTitle("Investment Proposal") +
      '<h3 style="font-size:11.5px;font-weight:700;color:#4a5b7a;margin:14px 0 8px;">Lump-sum Holdings</h3>' +
      (lumpRows.length ? repTable(["Scheme", "Category", "Current", "Suggested", "Action"], lumpRows) : '<p style="color:#8fa3c8;font-size:12px;">None</p>') +
      '<h3 style="font-size:11.5px;font-weight:700;color:#4a5b7a;margin:14px 0 8px;">SIP Holdings</h3>' +
      (sipRows.length ? repTable(["Scheme", "Category", "Current", "Suggested", "Frequency", "Action"], sipRows) : '<p style="color:#8fa3c8;font-size:12px;">None</p>');
    if (STATE.stpProposal.applicable === "Yes" && (STATE.stpProposal.rows || []).length > 0) {
      const stpRows = STATE.stpProposal.rows.map((r) => [escHtml(r.sourceFund), escHtml(r.targetFund), fmtINR(r.amount), r.frequency, String(r.durationMonths)]);
      body += '<h3 style="font-size:11.5px;font-weight:700;color:#4a5b7a;margin:14px 0 8px;">STP Moves</h3>' +
        repTable(["Source Fund", "Target Fund", "Amount", "Frequency", "Duration (mo)"], stpRows);
    }
  }
  if (has("prepay")) {
    if (!SNAPSHOTS.prepay || !SNAPSHOTS.prepay.result) {
      body += repSectionTitle("Loan Prepayment") + '<p style="color:#8fa3c8;font-size:12px;">Open the Loan Prepayment calculator once so its inputs are captured, then regenerate the report.</p>';
    } else {
      const r = SNAPSHOTS.prepay.result, ci2 = SNAPSHOTS.prepay.inputs;
      if (r.base.insufficient) {
        body += repSectionTitle("Loan Prepayment") + '<p style="color:#8fa3c8;font-size:12px;">This EMI doesn\'t cover the interest at ' + ci2.rate.toFixed(2) + '% — check the EMI or rate entered, then regenerate the report.</p>';
      } else {
      body += repSectionTitle("Loan Prepayment") + repStatGrid([
        ["Current EMI", fmtINR(r.emi)], ["Pending Tenure", ci2.pendingTenure + " mo"],
        ["Interest (no prepay)", fmtINR(r.base.interest)],
        r.prepay ? ["Interest Saved", fmtINR(r.base.interest - r.prepay.interest)] : ["Prepayment", "Not modelled"],
      ]) + repTable(["Item", "Value"], [
        ["Pending Outstanding", fmtINR(ci2.pendingAmount)], ["Rate of Interest", ci2.rate.toFixed(2) + "%"], ["EMI Mode", ci2.emiMode],
      ].concat(r.prepay ? [
        ["New Interest", fmtINR(r.prepay.interest)], ["New Tenure", r.prepay.months + " months"],
        ["Tenure Saved", (r.base.months - r.prepay.months) + " months"],
      ] : []));
      }
    }
  }
  if (has("ratechange")) {
    if (!SNAPSHOTS.ratechange || !SNAPSHOTS.ratechange.result) {
      body += repSectionTitle("Loan Rate Change") + '<p style="color:#8fa3c8;font-size:12px;">Open the Loan Rate Change calculator once so its inputs are captured, then regenerate the report.</p>';
    } else {
      const r = SNAPSHOTS.ratechange.result, ci2 = SNAPSHOTS.ratechange.inputs;
      if (r.base.insufficient || r.newRun.insufficient) {
        const badRate = r.base.insufficient ? ci2.oldRate : ci2.newRate;
        body += repSectionTitle("Loan Rate Change") + '<p style="color:#8fa3c8;font-size:12px;">The EMI doesn\'t cover the interest at ' + badRate.toFixed(2) + '% — the loan would never pay down. Adjust the inputs, then regenerate the report.</p>';
      } else {
      const emiDelta = r.newEMI - r.oldEMI, monthsDelta = r.newRun.months - r.base.months;
      body += repSectionTitle("Loan Rate Change") + repStatGrid([
        ["Current EMI", fmtINR(r.oldEMI)], ["New EMI", fmtINR(r.newEMI)],
        ["Interest Saved", fmtINR(r.base.interest - r.newRun.interest)],
        ["Adjust", ci2.mode === "emi" ? "Keep tenure, change EMI" : "Keep EMI, change tenure"],
      ]) + repTable(["Item", "Value"], [
        ["Pending Outstanding", fmtINR(ci2.pendingAmount)], ["Pending Tenure", ci2.pendingTenure + " months"],
        ["Old Rate", ci2.oldRate.toFixed(2) + "%"], ["New Rate", ci2.newRate.toFixed(2) + "%"],
        ["EMI Change", (emiDelta >= 0 ? "+" : "−") + fmtINR(Math.abs(emiDelta))],
        ["Tenure Change", (monthsDelta >= 0 ? "+" : "−") + Math.abs(monthsDelta) + " months"],
        ["Interest at Old Rate", fmtINR(r.base.interest)], ["Interest at New Rate", fmtINR(r.newRun.interest)],
      ]);
      }
    }
  }
  if (has("endowment")) {
    if (!SNAPSHOTS.endowment || !SNAPSHOTS.endowment.result) {
      body += repSectionTitle("Endowment Surrender") + '<p style="color:#8fa3c8;font-size:12px;">Open the Endowment Surrender calculator once so its inputs are captured, then regenerate the report.</p>';
    } else {
      const r = SNAPSHOTS.endowment.result, ei = SNAPSHOTS.endowment.inputs;
      const winner = (r.continueIRR !== null && r.surrenderIRR !== null) ? (r.surrenderIRR > r.continueIRR ? "Surrender & Invest" : "Continue Policy") : (r.surrenderValue <= 0 ? "Continue Policy" : "—");
      body += repSectionTitle("Endowment Surrender") + repStatGrid([
        ["Surrender Payout", fmtINR(r.surrenderValue)], ["Continue IRR", r.continueIRR === null ? "—" : fmtPct(r.continueIRR, 2)],
        ["Surrender IRR", r.surrenderIRR === null ? "—" : fmtPct(r.surrenderIRR, 2)], ["Recommendation", winner],
      ]) +
        '<h3 style="font-size:11.5px;font-weight:700;color:#4a5b7a;margin:14px 0 8px;">Policy Details</h3>' +
        repTable(["Item", "Value"], [
          ["Policy Name", escHtml(ei.policyName) || "—"], ["Start Year", String(ei.startYear)],
          ["Term", ei.term + " years"], ["Premium Type", ei.premiumType],
          ["Sum Assured", fmtINR(ei.sumAssured)], ["Annual Premium", fmtINR(ei.annualPremium)],
          ["Accrued Bonus", fmtINR(ei.accruedBonus)], ["Premiums Paid So Far", ei.premiumsPaid + " yrs"],
          ["MF Expected Return", ei.mfReturn.toFixed(2) + "%"],
          ["Scenario", ei.reinvestSavedPremiums ? "Reinvest saved premiums" : "Lump-sum only"],
        ]) +
        '<h3 style="font-size:11.5px;font-weight:700;color:#4a5b7a;margin:14px 0 8px;">Payout Breakdown</h3>' +
        repTable(["Item", "Value"], [
          ["Special Surrender Value (SSV)", fmtINR(r.ssv)], ["Guaranteed Surrender Value (GSV)", r.gsvApplicable ? fmtINR(r.gsv) : "N/A (not applicable in policy year 1)"],
          ["Payout on Surrender", fmtINR(r.surrenderValue)], ["Maturity Value (if continued)", fmtINR(r.maturity)],
          ["MF Corpus at Maturity", fmtINR(r.mfFinalValue)], ["Years to Maturity", r.yearsToMaturity + " years"],
        ]);
    }
  }

  let overallStatus = { label: "Healthy Financial Position", color: "#27AE7A", bg: "rgba(39,174,122,0.16)" };
  if (c.trueSurplusMonthly < 0 || c.debtServiceRatio > 0.5) overallStatus = { label: "Needs Immediate Attention", color: "#E05454", bg: "rgba(224,84,84,0.16)" };
  else if (c.savingsRate < 0.2 || c.emergencyStatus !== "Adequate") overallStatus = { label: "Room for Improvement", color: "#D97A30", bg: "rgba(217,122,48,0.16)" };

  const insight = overallStatus.label === "Healthy Financial Position"
    ? "This plan shows a stable financial base — positive surplus, reasonable savings rate, and an adequate emergency buffer. The focus going forward should be on staying on track with retirement and goal-based investing, and reviewing this plan annually as income and priorities evolve."
    : overallStatus.label === "Room for Improvement"
      ? "There are a few areas worth tightening — savings rate, emergency fund adequacy, or protection cover may need a closer look. None of these are urgent, but addressing them now will meaningfully improve long-term outcomes."
      : "This plan flags an immediate concern — either monthly cash flow is negative or debt obligations are consuming a large share of income. We recommend prioritising a cash-flow review and a debt reduction plan before committing to new long-term investments.";

  return '<!doctype html><html><head><meta charset="utf-8"><title>Financial Plan — ' + escHtml(STATE.profile.name || "Client") + '</title>' +

function repSectionTitle(t, icon) { return '<h2 class="rp-h2"><span class="ic">' + (icon || "▸") + '</span>' + t + '</h2>'; }
function repStatGrid(pairs) {
  return '<div class="rp-stat-grid">' + pairs.map((p) => '<div class="rp-stat"><div class="l">' + p[0] + '</div><div class="v">' + p[1] + '</div></div>').join("") + '</div>';
}
function repTable(headers, rows) {
  return '<table class="rp-table"><thead><tr>' + headers.map((h) => "<th>" + h + "</th>").join("") + '</tr></thead><tbody>' +
    rows.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("") + '</tbody></table>';
}
function repBars(bars, opts) {
  opts = opts || {};
  const w = 720, h = 26, gap = 10, labelW = 190, valW = 100;
  const max = Math.max.apply(null, bars.map((b) => Math.abs(b.value)).concat([1]));
  const chartW = w - labelW - valW - 20;
  const total = h * bars.length + gap * (bars.length - 1) + 16;
  const fmt = opts.format || ((n) => n.toLocaleString("en-IN"));
  const rows = bars.map((b, i) => {
    const y = 8 + i * (h + gap);
    const bw = Math.max(2, (Math.abs(b.value) / max) * chartW);
    const color = b.color || "#4f8ef7";
    return '<text x="0" y="' + (y + 17) + '" fill="#5c6e8e" font-size="11.5">' + b.label + '</text>' +
      '<rect x="' + labelW + '" y="' + (y + 3) + '" width="' + chartW + '" height="' + (h - 6) + '" fill="#eef2f9" rx="4"/>' +
      '<rect x="' + labelW + '" y="' + (y + 3) + '" width="' + bw + '" height="' + (h - 6) + '" fill="' + color + '" rx="4"/>' +
      '<text x="' + (w - 4) + '" y="' + (y + 17) + '" text-anchor="end" fill="#11203a" font-size="11.5" font-weight="600">' + fmt(b.value) + '</text>';
  }).join("");
  return '<div class="rp-table" style="padding:14px 16px;margin-top:10px;"><svg viewBox="0 0 ' + w + ' ' + total + '" width="100%" height="' + total + '" preserveAspectRatio="xMinYMin meet" style="display:block">' + rows + '</svg></div>';
}
function repDonut(slices, centerTop, centerBottom) {
  const total = slices.reduce((s, x) => s + x.value, 0) || 1;
  const r = 78, ir = 52, cx = 100, cy = 100;
  let a0 = -Math.PI / 2;
  const paths = slices.filter((s) => s.value > 0).map((s) => {
    const a1 = a0 + (s.value / total) * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const xi1 = cx + ir * Math.cos(a1), yi1 = cy + ir * Math.sin(a1);
    const xi0 = cx + ir * Math.cos(a0), yi0 = cy + ir * Math.sin(a0);
    const d = "M" + x0 + " " + y0 + " A" + r + " " + r + " 0 " + large + " 1 " + x1 + " " + y1 + " L" + xi1 + " " + yi1 + " A" + ir + " " + ir + " 0 " + large + " 0 " + xi0 + " " + yi0 + " Z";
    a0 = a1;
    return '<path d="' + d + '" fill="' + s.color + '" opacity="0.92"/>';
  }).join("");
  const legend = slices.map((s) => '<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;"><span style="width:10px;height:10px;border-radius:3px;background:' + s.color + ';display:inline-block;"></span>' + s.label + ' — ' + ((s.value / total) * 100).toFixed(1) + '%</div>').join("");
  return '<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:12px 0;"><svg viewBox="0 0 200 200" width="150" height="150">' + paths +
    '<text x="100" y="96" text-anchor="middle" fill="#8fa3c8" font-size="9">' + centerTop + '</text>' +
    '<text x="100" y="114" text-anchor="middle" fill="#0e1c2f" font-size="14" font-weight="700">' + centerBottom + '</text></svg>' +
    '<div style="display:grid;gap:6px;">' + legend + '</div></div>';
}
