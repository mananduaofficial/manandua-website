<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='40' fill='%231d2e28'/%3E%3Cpath d='M15,100 L100,88 L185,100 L100,112 Z' fill='%23faf8f3' opacity='0.3'/%3E%3Cpath d='M100,15 L112,100 L100,185 L88,100 Z' fill='%23cfa54f'/%3E%3Crect x='96' y='96' width='8' height='8' fill='%231d2e28' transform='rotate(45 100 100)'/%3E%3C/svg%3E">
<title>Client Onboarding — Manan Dua</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Palette matches manandua.in live site (forest/gold/Cormorant Garamond) */
  --navy:#1d2e28;--navy2:#2a4038;--navy3:#3a5448;
  --gold:#b8903a;--gold2:#cfa54f;--gold3:#f0e6cc;
  --bg:#faf8f3;--bg2:#fff;--bg3:#ede8de;
  --text:#1c1917;--text2:#4a4038;--text3:#8c8070;
  --border:rgba(42,64,56,.14);--border2:rgba(42,64,56,.28);
  --green:#0A6E4F;--green-bg:#E8F5F1;--green-bd:#A3D4C4;
  --red:#991B1B;--red-bg:#FEF2F2;--red-bd:#FCA5A5;
  --amber:#92400E;--amber-bg:#FFFBEB;--amber-bd:#FCD34D;
  --blue:#1E3A5F;--blue-bg:#EFF6FF;--blue-bd:#BFDBFE;
  --r:8px;--rl:14px;--rxl:20px;
  --sh:0 1px 4px rgba(29,46,40,.08);--shl:0 8px 32px rgba(29,46,40,.12);
}
html,body{min-height:100%;font-family:'Inter',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}

/* ── LAYOUT ── */
#app{min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--navy);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:100}
.header-brand{display:flex;align-items:center;gap:12px}
.header-logo{width:36px;height:36px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center}
.header-name{font-size:15px;font-weight:600;color:#fff;letter-spacing:-.02em}
.header-reg{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.header-badge{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.3);color:var(--gold2);font-size:10px;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.05em}

.page{flex:1;max-width:760px;width:100%;margin:0 auto;padding:32px 20px 80px}

/* ── PROGRESS ── */
.progress-wrap{margin-bottom:36px}
.progress-steps{display:flex;gap:0;margin-bottom:16px}
.ps{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.ps::before{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--border);z-index:0}
.ps:last-child::before{display:none}
.ps-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text3);position:relative;z-index:1;transition:all .3s}
.ps.done .ps-dot{background:var(--navy);border-color:var(--navy);color:#fff}
.ps.active .ps-dot{background:var(--gold);border-color:var(--gold);color:var(--navy);box-shadow:0 0 0 4px rgba(201,168,76,.2)}
.ps-label{font-size:10px;color:var(--text3);margin-top:6px;text-align:center;font-weight:500;white-space:nowrap}
.ps.active .ps-label{color:var(--gold);font-weight:600}
.ps.done .ps-label{color:var(--navy)}
.progress-bar-wrap{height:3px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:99px;transition:width .5s ease}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:28px 32px;box-shadow:var(--sh);margin-bottom:16px}
.card-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--navy);margin-bottom:6px}
.card-sub{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.sec-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ── FORMS ── */
.fg{margin-bottom:16px}
.fl{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}
.fl em{color:var(--red);font-style:normal}
.fl .hint{font-size:11px;color:var(--text3);font-weight:400;margin-left:6px}
input,select,textarea{width:100%;padding:10px 13px;border:1.5px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--bg2);color:var(--text);outline:none;font-family:inherit;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,31,58,.08)}
input.err,select.err{border-color:var(--red)}
.err-msg{font-size:11px;color:var(--red);margin-top:4px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
textarea{resize:vertical;min-height:72px}

/* ── QUESTION CARDS ── */
.q-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--rl);padding:22px 26px;margin-bottom:14px;transition:border-color .2s}
.q-card.answered{border-color:rgba(11,31,58,.15)}
.q-num{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.q-label{font-size:14px;font-weight:500;color:var(--text);line-height:1.6;margin-bottom:16px}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1.5px solid var(--border2);border-radius:var(--r);cursor:pointer;transition:all .15s;font-size:13px;color:var(--text2);line-height:1.4}
.q-opt:hover{border-color:var(--navy);background:var(--bg3);color:var(--text)}
.q-opt.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.q-dot{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .15s}
.q-opt.sel .q-dot{background:#fff;border-color:#fff;color:var(--navy)}
.q-dot::after{content:'✓';display:none;font-weight:700}
.q-opt.sel .q-dot::after{display:block}

/* ── SECTION NAV ── */
.sec-nav{display:flex;align-items:center;gap:6px;margin-bottom:28px;flex-wrap:wrap}
.sec-pip{width:32px;height:4px;border-radius:99px;background:var(--border);transition:all .3s;cursor:pointer}
.sec-pip.done{background:var(--navy)}
.sec-pip.active{background:var(--gold);width:48px}
.sec-meta{margin-left:auto;font-size:12px;color:var(--text3)}

/* ── DISCLOSURES ── */
.disc-item{border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.disc-title{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.disc-title i{font-size:14px;color:var(--gold)}
.disc-body{font-size:12px;color:var(--text2);line-height:1.7}
.disc-body li{margin-left:16px;margin-bottom:3px}
.consent-box{background:var(--navy);border-radius:var(--rl);padding:20px 24px;margin-top:20px;display:flex;align-items:flex-start;gap:14px;cursor:pointer}
.consent-check{width:22px;height:22px;border:2px solid rgba(255,255,255,.3);border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .2s}
.consent-box.agreed .consent-check{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.consent-text{font-size:13px;color:rgba(255,255,255,.85);line-height:1.6}
.consent-text strong{color:#fff}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .15s;font-family:inherit;line-height:1}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:var(--navy3)}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-gold:hover{background:var(--gold2)}
.btn-sec{background:var(--bg2);color:var(--text2);border-color:var(--border2)}
.btn-sec:hover{background:var(--bg3);color:var(--text)}
.btn-ghost{background:transparent;color:var(--text2);border-color:transparent;padding-left:0}
.btn-ghost:hover{color:var(--text)}
.btn:disabled{opacity:.4;pointer-events:none}.btn.disabled{opacity:.4}
.btn-lg{padding:14px 28px;font-size:14px;border-radius:var(--rl)}
.btn-row{display:flex;align-items:center;justify-content:space-between;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}

/* ── REPORT ── */
.report-hero{background:var(--navy);border-radius:var(--rl);padding:32px;margin-bottom:20px;color:#fff}
.report-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.report-profile{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:var(--gold2);margin-bottom:4px}
.report-score{font-size:13px;color:rgba(255,255,255,.6)}
.score-sections{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.score-sec{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.ss-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.ss-val{font-size:18px;font-weight:700;color:var(--navy);font-family:'Cormorant Garamond',serif}
.ss-sub{font-size:10px;color:var(--text3);margin-top:2px}
.override-notice{background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:var(--r);padding:12px 14px;font-size:12px;color:var(--amber);margin-bottom:12px}
.override-notice i{margin-right:6px}
.disc-badge{display:inline-flex;align-items:center;gap:5px;background:var(--red-bg);border:1px solid var(--red-bd);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--red)}

/* ── SIGNATURE ── */
.sig-box{border:1.5px dashed var(--border2);border-radius:var(--r);padding:20px;text-align:center;margin-top:12px;background:var(--bg3)}
.sig-line{height:60px;border-bottom:1.5px solid var(--border2);margin-bottom:8px}
.sig-label{font-size:11px;color:var(--text3)}

/* ── CKYC FORM ── */
.ckyc-consent-text{background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:var(--r);padding:14px 16px;font-size:12px;color:var(--blue);line-height:1.7;margin-bottom:18px}

/* ── DECLARATION ── */
.declaration{background:var(--bg3);border-radius:var(--r);padding:16px 18px;font-size:12px;color:var(--text2);line-height:1.7;border:1px solid var(--border);margin-bottom:16px}
.declaration p{margin-bottom:8px}
.declaration p:last-child{margin-bottom:0}

/* ── ALERTS ── */
.ntc{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--r);margin-bottom:12px;font-size:12px;font-weight:500;line-height:1.5}
.ntc i{font-size:15px;flex-shrink:0;margin-top:1px}
.ntc-gold{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.ntc-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.ntc-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.ntc-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}


/* ── MODAL (replaces native alert/confirm) ── */
.ob-modal-overlay{position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:998;display:flex;align-items:center;justify-content:center;padding:20px}
.ob-modal{background:#fff;border-radius:var(--rl);max-width:440px;width:100%;padding:26px 28px;box-shadow:var(--shl)}
.ob-modal-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:9px}
.ob-modal-title.err{color:var(--red)}
.ob-modal-title.warn{color:var(--amber)}
.ob-modal-body{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:22px;white-space:pre-line}
.ob-modal-actions{display:flex;justify-content:flex-end;gap:10px}

/* ── ESIGN CANVAS ── */
.esign-wrap{border:1.5px solid var(--border2);border-radius:var(--r);background:#fff;overflow:hidden;position:relative}
.esign-canvas{display:block;width:100%;height:120px;cursor:crosshair;touch-action:none}
.esign-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg3);border-top:1px solid var(--border)}
.esign-bar span{font-size:11px;color:var(--text3)}
.esign-typed{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--navy);padding:20px 14px 8px;min-height:80px;letter-spacing:.02em}
.esign-tabs{display:flex;gap:2px;margin-bottom:8px}
.esign-tab{padding:5px 14px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);transition:all .15s}
.esign-tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── PRINT ── */
@media print{
  #print-transcript{ display:block!important; }
  .header,.progress-wrap,.btn-row,.btn,.no-print{display:none!important}
  @page{ margin:15mm; size:A4; }
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  body{background:#fff}
  .report-hero{background:#0B1F3A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ── MOBILE ── */
@media(max-width:640px){
  .page{padding:20px 14px 60px}
  .r2,.r3{grid-template-columns:1fr}
  .score-sections{grid-template-columns:1fr 1fr}
  .card{padding:20px 18px}
}

/* ── SUCCESS ── */
.success-screen{text-align:center;padding:60px 20px}
.success-icon{width:72px;height:72px;background:var(--green-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;color:var(--green)}
.success-title{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--navy);margin-bottom:10px}
.success-sub{font-size:14px;color:var(--text2);line-height:1.6;max-width:420px;margin:0 auto 28px}
.summary-table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;margin:0 0 24px}
.summary-table tr{border-bottom:1px solid var(--border)}
.summary-table td:first-child{color:var(--text3);padding:8px 0;width:40%}
.summary-table td:last-child{color:var(--text);font-weight:500;padding:8px 0}
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="header-brand">
      <div class="header-logo"><svg width="20" height="20" viewBox="0 0 200 200"><path d="M15,100 L100,88 L185,100 L100,112 Z" fill="#faf8f3" opacity="0.3"/><path d="M100,15 L112,100 L100,185 L88,100 Z" fill="var(--gold2)"/><rect x="96" y="96" width="8" height="8" fill="var(--navy)" transform="rotate(45 100 100)"/></svg></div>
      <div>
        <div class="header-name" id="hdr-firm">Manan Dua</div>
        <div class="header-reg" id="hdr-reg">AMFI MFD · ARN-365491</div>
      </div>
    </div>
    <div class="header-badge" id="hdr-badge">CLIENT ONBOARDING</div>
  </header>
  <div class="page" id="page"></div>
<div id="rpq-nav" style="display:none;position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--border);padding:14px 20px;align-items:center;justify-content:space-between;z-index:50;max-width:760px;width:100%;margin:0 auto">
  <button class="btn btn-ghost" id="rpq-prev-btn" onclick="rpqPrev()"><i class="ti ti-arrow-left"></i> <span id="rpq-prev-label">Previous</span></button>
  <button class="btn btn-primary bsm" id="rpq-main-btn" onclick="rpqNext()" style="min-width:auto;padding:8px 20px;font-size:13px"><span id="rpq-btn-label">Next</span> <i class="ti ti-arrow-right"></i></button>
</div>
</div>

<script>
// ═══════════════════════════ CONFIG — UPDATE THESE ══════════════════════════
const CFG = {
  firm:        'Manan Dua',   // sole proprietorship — Meridian is the newsletter/workshop brand only, not used here
  distributor: 'Manan Dua',
  arn:         'ARN-365491',     // AMFI ARN, valid 16-Jul-2026 to 19-Jun-2029
  euin:        'E699297',        // applicable — this is an individual ARN holder acting as the seller
  email:       'wealth@manandua.in',
  phone:       '+91 XXXXXXXXXX',  // ← your phone
};

function FIRM(){ return CFG.firm; }
// ════════════════════════════════════════════════════════════════════════════

const TODAY = new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
const TODAY_ISO = new Date().toISOString().slice(0,10);

// ── STATE ────────────────────────────────────────────────────────────────────
let S = {
  stage: 'details',
  role: 'MFD',           // fixed — this is an MFD-only onboarding flow
  details: {},          // personal details form data
  answers: {},          // RPQ answers {qId: optionIndex}
  rpqSection: 0,        // current section 0-4
  agreed: false,        // disclosures consent
  ckycData: {},         // CKYC form data
  result: null,
  ekyc: null,         // ekyc status selection         // computed RPQ result
};

const STAGES = ['details','disclosures','rpq','ckyc','report','ekyc'];
const STAGE_LABELS = ['Your details','Disclosures','Risk profile','KYC consent','Report','eKYC'];

// ── RPQ DATA (ported from Lovable rpq.ts exactly) ────────────────────────────
const SECTIONS = ['capacity','tolerance','behavioral','requirement','experience'];
const SEC_META = {
  capacity:    {tag:'A', title:'Risk Capacity',          sub:'Your financial ability to absorb losses.',                  weight:.30},
  tolerance:   {tag:'B', title:'Risk Tolerance',         sub:'Your emotional comfort with market ups and downs.',          weight:.25},
  behavioral:  {tag:'C', title:'Behavioural Deep Dive',  sub:'How you actually make decisions under uncertainty.',          weight:.20},
  requirement: {tag:'D', title:'Risk Requirement',       sub:'How much risk do your goals actually demand?',               weight:.15},
  experience:  {tag:'E', title:'Experience & Knowledge', sub:'What you have seen and understand about markets.',            weight:.10},
};

const QUESTIONS = [
  // A — Capacity (6 Qs, weight 30%)
  {id:'a_age',sec:'capacity',label:'What is your current age?',opts:[['Below 30 years',4],['30–40 years',3],['41–55 years',2],['Above 55 years',1]]},
  {id:'a_income',sec:'capacity',label:'How stable and predictable is your primary income source?',opts:[['Very stable — government job, established business or tenured profession',4],['Mostly stable — salaried private sector, consistent freelance income',3],['Somewhat variable — commissions, contract-based, or project income',2],['Highly variable or uncertain — startup, early business, irregular work',1]]},
  {id:'a_emergency',sec:'capacity',label:'How many months of living expenses do you have in an emergency fund (liquid, accessible savings)?',opts:[['More than 12 months',4],['6–12 months',3],['3–6 months',2],['Less than 3 months',1]]},
  {id:'a_dependents',sec:'capacity',label:'How many financial dependents do you currently support (children, elderly parents, etc.)?',opts:[['None',4],['1–2',3],['3–4',2],['5 or more',1]]},
  {id:'a_debt',sec:'capacity',label:'What is your current total debt (EMIs, loans) as a percentage of your monthly income?',opts:[['Less than 10%',4],['10–25%',3],['26–40%',2],['More than 40%',1]]},
  {id:'a_invest_ratio',sec:'capacity',label:'What proportion of your total monthly household income are you investing (or planning to invest)?',opts:[['More than 40% — investment is primary financial activity',4],['20–40% — investing significant portion alongside expenses',3],['10–20% — modest investing after meeting all expenses',2],['Less than 10% — most income is committed to living expenses',1]]},
  // B — Tolerance (6 Qs, weight 25%)

// ── SCORING ENGINE (exact port of rpq.ts) ────────────────────────────────────
function scoreSection(sec) {
  const qs = QUESTIONS.filter(q=>q.sec===sec);
  let raw = 0;
  qs.forEach(q=>{
    const a = S.answers[q.id];
    if(a==null) return;
    if(Array.isArray(a)) raw += a.length ? Math.max(...a.map(i=>q.opts[i][1])) : 0;
    else raw += q.opts[a][1];
  });
  const max = qs.length * 4;
  const pct = max>0 ? raw/max : 0;
  const norm = Math.round(pct*1000)/10;
  const level = pct<.5 ? 'Low' : pct<.75 ? 'Moderate' : 'High';
  return {raw,max,pct,norm,level};
}

function computeResult() {
  const cap  = scoreSection('capacity');
  const tol  = scoreSection('tolerance');
  const beh  = scoreSection('behavioral');
  const req  = scoreSection('requirement');
  const exp  = scoreSection('experience');
  // Rule 2: tolerance vs behavioral — if diff >15, use lower for both
  let bEff=tol.norm, cEff=beh.norm;
  const tolAdj = Math.abs(bEff-cEff)>15;
  if(tolAdj){const lo=Math.min(bEff,cEff);bEff=lo;cEff=lo;}
  const ws = cap.norm*.30 + bEff*.25 + cEff*.20 + req.norm*.15 + exp.norm*.10;
  const ORDER=['Conservative','Moderately Conservative','Moderate','Moderately Aggressive','Aggressive'];
  let profile = ws<35?'Conservative':ws<50?'Moderately Conservative':ws<65?'Moderate':ws<80?'Moderately Aggressive':'Aggressive';
  // Rule 1: capacity cap
  let capCap=false;
  if(cap.norm<40 && ORDER.indexOf(profile)>ORDER.indexOf('Moderate')){profile='Moderate';capCap=true;}
  const goalMismatch = req.norm-cap.norm>25;
  const complexRestricted = exp.raw>=4&&exp.raw<=6;
  return {cap,tol,beh,req,exp,ws,tolAdj,capCap,goalMismatch,complexRestricted,profile};
}

// ── VALIDATION ────────────────────────────────────────────────────────────────
function validPAN(p){return /^[A-Z]{5}[0-9]{4}[A-Z]$/.test((p||'').toUpperCase());}
function validMobile(m,rs){
  const d=(m||'').replace(/\D/g,'');
  return rs==='NRI' ? d.length>=8&&d.length<=15 : d.length===10;
}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||'');}

function validateDetails() {
  const d=S.details, errs={};
  if(!d.name||d.name.trim().length<2) errs.name='Full name required (at least 2 characters)';
  if(!d.pan||!validPAN(d.pan)) errs.pan='PAN must be in format AAAAA9999A';
  if(!d.mobile||!validMobile(d.mobile,d.resStatus)) {
    errs.mobile = (d.resStatus==='NRI') ? 'NRI mobile: 8–15 digits including country code' : 'Mobile must be exactly 10 digits';
  }
  if(d.email&&!validEmail(d.email)) errs.email='Invalid email address';
  if(!d.dob) errs.dob='Date of birth required';
  else if(new Date(d.dob)>new Date()) errs.dob='Date of birth cannot be in the future';
  if(!d.city||d.city.trim().length<2) errs.city='City / place of residence required';
  return errs;
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function updateRPQNav() {
  var nav = document.getElementById('rpq-nav');
  if (!nav) return;
  if (S.stage !== 'rpq') { nav.style.display = 'none'; return; }
  nav.style.display = 'flex';
  var isLast = S.rpqSection >= SECTIONS.length - 1;
  var isFirst = S.rpqSection === 0;
  var btnLabel = document.getElementById('rpq-btn-label');
  var prevLabel = document.getElementById('rpq-prev-label');
  if (btnLabel) btnLabel.textContent = isLast ? 'View my risk profile' : 'Next';
  if (prevLabel) prevLabel.textContent = isFirst ? 'Back' : 'Previous';
}

function rpqPrev() {
  if (S.rpqSection === 0) go('disclosures');
  else prevSec();
}

function render() {
  // Role page removed — both portals start at details
  if(S.stage === 'role') S.stage = 'details';
  const stageIdx = STAGES.indexOf(S.stage);
  const page = document.getElementById('page');
  var firmEl = document.getElementById('hdr-firm');
  if(firmEl) firmEl.textContent = FIRM();
  var regEl = document.getElementById('hdr-reg');
  if(regEl) regEl.textContent = 'AMFI MFD · ' + CFG.arn + ' · EUIN ' + CFG.euin;
  document.getElementById('hdr-badge').textContent = S.stage==='done' ? 'COMPLETED' : 'CLIENT ONBOARDING';

  let html = '';

  // Progress bar (skip on role and done screens)
  if(S.stage!=='role'&&S.stage!=='done') {
    const pct = Math.round((stageIdx/( STAGES.length-1))*100);
    html += `<div class="progress-wrap">
      <div class="progress-steps">
        ${STAGES.slice(0,-1).map((s,i)=>{
          const isDone=stageIdx>i,isActive=stageIdx===i;
          return `<div class="ps${isDone?' done':isActive?' active':''}">
            <div class="ps-dot">${isDone?'<i class="ti ti-check" style="font-size:11px"></i>':(i+1)}</div>
            <div class="ps-label">${STAGE_LABELS[i]}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    </div>`;
  }


  // Page content (separate from progress bar)
  if(S.stage==='details')          html += pgDetails();
  else if(S.stage==='disclosures') html += pgDisclosures();
  else if(S.stage==='rpq')         html += pgRPQ();
  else if(S.stage==='ckyc')        html += pgCKYC();
  else if(S.stage==='report')      html += pgReport();
  else if(S.stage==='ekyc')        html += pgEKYC();
  else if(S.stage==='done')        html += pgDone();

  page.innerHTML = html;
  window.scrollTo({top:0,behavior:'smooth'});
  bindEvents();
  updateRPQNav();
}

              <span>${opt[0]}</span>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function go(stage){S.stage=stage;render();}

function rpqNext() {
  console.log('rpqNext called, section:', S.rpqSection, 'of', SECTIONS.length-1);
  var sec = SECTIONS[S.rpqSection];
  var qs = QUESTIONS.filter(function(q){ return q.sec === sec; });
  var complete = qs.every(function(q){ return S.answers[q.id] != null; });
  console.log('section:', sec, 'questions:', qs.length, 'complete:', complete);
  if (!complete) {
    toast('Please answer all questions in this section before continuing');
    qs.forEach(function(q){
      if(S.answers[q.id] == null){
        var card = document.querySelector('[data-qid="'+q.id+'"]');
        if(card){
          card.style.outline='2px solid var(--red)';
          setTimeout(function(){ card.style.outline=''; }, 2000);
        }
      }
    });
    return;
  }
  // Determine if last section here, not at render time
  var isLast = (S.rpqSection >= SECTIONS.length - 1);
  if (isLast) {
    finishRPQ();
  } else {
    nextSec();
  }
}

function discNext(){
  if(!S.agreed){
    var cbox = document.getElementById('consent-box');
    if(cbox){ cbox.style.outline='2px solid var(--red)'; setTimeout(()=>cbox.style.outline='',1500); }
    toast('Please read and tick the consent box to continue');
    return;
  }
  go('rpq');
}

function toggleAgreed(){
  S.agreed = !S.agreed;
  var cbox = document.getElementById('consent-box');
  var chk  = document.getElementById('consent-check-icon');
  var btn  = document.getElementById('disc-next-btn');
  if(cbox) cbox.classList.toggle('agreed', S.agreed);
  if(chk)  chk.style.color = S.agreed ? 'var(--navy)' : 'transparent';
  if(btn){
    btn.style.opacity = S.agreed ? '1' : '0.45';
    btn.style.background = S.agreed ? 'var(--navy)' : '#9ca3af';
  }
}

  S.ckycData[k]=v;

  if(k==='nomination'){
    document.querySelectorAll('[data-nom]').forEach(function(el){
      var isSelected = el.getAttribute('data-nom')===v;

      if(dot) dot.innerHTML=isSelected?'<i class="ti ti-check" style="font-size:10px"></i>':'';

function selectOpt(qid, oi, isMulti) {
  // Update answer state
  if(isMulti){
    var cur = Array.isArray(S.answers[qid]) ? S.answers[qid].slice() : [];
    var idx = cur.indexOf(oi);
    if(idx > -1) cur.splice(idx,1); else cur.push(oi);
    S.answers[qid] = cur;
  } else {
    S.answers[qid] = oi;
  }

  // Update only the clicked card's visual state — no scroll, no re-render
  var card = document.querySelector('[data-qid="'+qid+'"]');
  if(card) {
    var opts = card.querySelectorAll('.q-opt');
    opts.forEach(function(el, i){
      var sel = isMulti
        ? Array.isArray(S.answers[qid]) && S.answers[qid].indexOf(i) > -1
        : S.answers[qid] === i;
      el.classList.toggle('sel', sel);
      var dot = el.querySelector('.q-dot');
      if(dot) dot.innerHTML = sel ? '<i class="ti ti-check" style="font-size:10px"></i>' : '';
    });
    card.classList.add('answered');
  }

  // Update answered counter
  var answered = QUESTIONS.filter(function(q){ return S.answers[q.id] != null; }).length;
  var ctr = document.getElementById('rpq-answered-count');
  if(ctr) ctr.textContent = answered + '/' + QUESTIONS.length;

  // Update section progress pips
  var sec = SECTIONS[S.rpqSection];
  var qs = QUESTIONS.filter(function(q){ return q.sec === sec; });
  var secComplete = qs.every(function(q){ return S.answers[q.id] != null; });

  // Update Next button colour in-place (it's always clickable — onclick validates)
  var btns = document.querySelectorAll('.btn-primary');
  btns.forEach(function(btn){
    if(btn.textContent.trim().indexOf('Next') > -1 || btn.textContent.trim().indexOf('View my risk') > -1){
      btn.style.background = secComplete ? 'var(--navy)' : '#9ca3af';
      btn.style.cursor = secComplete ? 'pointer' : 'default';
    }
  });

  // Update hint text
  var hint = document.querySelector('.q-hint');
  if(hint) hint.textContent = secComplete ? '✓ Section complete' : 'Answer all questions to continue';
}

function submitCKYC(){
  // Validation — nomination preference is required for single holdings; optional for joint holdings
  if(S.ckycData.holdingType!=='joint' && !S.ckycData.nomination){
    showObModal({kind:'warn', title:'Nomination required', body:'Please select your nomination preference (register a nominee or opt out) before proceeding.'});
    return;
  }
  if(S.ckycData.nomination==='submit'){
    var errs = {};
    var nominees = S.ckycData.nominees && S.ckycData.nominees.length ? S.ckycData.nominees : [{name:'',relation:''}];
    nominees.forEach(function(n,i){
      if(!n.name || n.name.trim().length<2) errs['nomName'+i] = 'Please enter nominee ' + (i+1) + '\u2019s full name.';
      if(!n.relation) errs['nomRelation'+i] = 'Please select nominee ' + (i+1) + '\u2019s relationship to you.';
    });
    if(Object.keys(errs).length){
      S._ckycErrs = errs;
      var extra = document.getElementById('nom-extra');
      if(extra) extra.innerHTML = renderNomExtra();
      showObModal({kind:'err', title:'Nominee details incomplete', body:'\u2022 ' + Object.values(errs).join('\n\u2022 ')});
      return;
    }
  }
  S._ckycErrs = {};
  // Export data to JSON for CRM import
  exportForCRM();
  go('ekyc');
}

// ── ESIGN CANVAS ──────────────────────────────────────────────────────────────
let _signMode = 'draw';   // 'draw' | 'type'
let _signCanvas = null;
let _signing = false;
let _signHasData = false;

function initSignCanvas() {
  const canvas = document.getElementById('esign-canvas');
  if (!canvas) return;
  _signCanvas = canvas;
  const ctx = canvas.getContext('2d');
  // Scale for retina
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#0B1F3A';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left), y: (src.clientY - r.top) };
  }
  canvas.addEventListener('mousedown',  e => { _signing=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x,p.y); });
  canvas.addEventListener('mousemove',  e => { if(!_signing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); _signHasData=true; updateSignStatus(); });
  canvas.addEventListener('mouseup',    () => _signing=false);
  canvas.addEventListener('mouseleave', () => _signing=false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); _signing=true; ctx.beginPath(); const p=getPos(e); ctx.moveTo(p.x,p.y); }, {passive:false});
  canvas.addEventListener('touchmove',  e => { e.preventDefault(); if(!_signing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); _signHasData=true; updateSignStatus(); }, {passive:false});
  canvas.addEventListener('touchend',   () => _signing=false);
}

function clearSign() {
  if (!_signCanvas) return;
  const ctx = _signCanvas.getContext('2d');
  ctx.clearRect(0, 0, _signCanvas.width, _signCanvas.height);
  _signHasData = false;
  updateSignStatus();
}

function setSignMode(mode) {
  _signMode = mode;
  const tabs = document.querySelectorAll('.esign-tab');
  tabs.forEach(t => t.classList.toggle('on', t.dataset.mode === mode));
  const drawWrap   = document.getElementById('esign-draw-wrap');
  const typeWrap   = document.getElementById('esign-type-wrap');
  const uploadWrap = document.getElementById('esign-upload-wrap');
  if (drawWrap)   drawWrap.style.display   = mode==='draw'   ? '' : 'none';
  if (typeWrap)   typeWrap.style.display   = mode==='type'   ? '' : 'none';
  if (uploadWrap) uploadWrap.style.display = mode==='upload' ? '' : 'none';
  if (mode === 'draw') setTimeout(initSignCanvas, 50);
  updateSignStatus();
}

function updateSignStatus() {
  const hasTyped = (document.getElementById('esign-type-input')?.value||'').trim().length > 1;
  const ok = (_signMode==='draw' && _signHasData) || (_signMode==='type' && hasTyped) || (_signMode==='upload' && _signHasData);
  const elId = _signMode==='draw' ? 'esign-status-draw' : _signMode==='type' ? 'esign-status-type' : 'esign-status-upload';
  const el = document.getElementById(elId);
  if (el) {
    el.textContent = ok ? '✓ Acknowledgement captured' : (_signMode==='draw' ? 'Draw your signature above' : _signMode==='type' ? 'Type your name above' : 'Upload a signature image above');
    el.style.color = ok ? 'var(--green)' : 'var(--text3)';
  }
  S._signDone = ok;
}

function getSignDataURL() {
  if (_signMode === 'draw' && _signCanvas) return _signCanvas.toDataURL('image/png');
  const typed = (document.getElementById('esign-type-input')?.value||'').trim();
  return typed ? 'typed:' + typed : null;
}

function toast(msg, isErr) {
  let el = document.getElementById('ob-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ob-toast';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0B1F3A;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3)';
    document.body.appendChild(el);
  }
  if (isErr) el.style.background = '#991B1B';
  else el.style.background = '#0B1F3A';
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 3000);
}

// ── MODAL (replaces native alert()/confirm() so messages match the site's design) ──
function showObModal(opts) {
  var old = document.getElementById('ob-modal-overlay');
  if (old) old.remove();
  var overlay = document.createElement('div');
  overlay.id = 'ob-modal-overlay';
  overlay.className = 'ob-modal-overlay';
  var iconMap = {info:'ti-info-circle', warn:'ti-alert-triangle', err:'ti-alert-triangle'};
  var titleClass = opts.kind === 'err' ? 'err' : opts.kind === 'warn' ? 'warn' : '';
  overlay.innerHTML =
    '<div class="ob-modal">' +
      '<div class="ob-modal-title ' + titleClass + '"><i class="ti ' + (iconMap[opts.kind]||'ti-info-circle') + '"></i>' + opts.title + '</div>' +
      '<div class="ob-modal-body">' + opts.body + '</div>' +
      '<div class="ob-modal-actions">' +
        (opts.cancelLabel ? '<button class="btn btn-sec" id="ob-modal-cancel">' + opts.cancelLabel + '</button>' : '') +
        '<button class="btn btn-primary" id="ob-modal-confirm">' + (opts.confirmLabel || 'OK') + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('ob-modal-confirm').onclick = function(){ overlay.remove(); if(opts.onConfirm) opts.onConfirm(); };
  if (opts.cancelLabel) {
    document.getElementById('ob-modal-cancel').onclick = function(){ overlay.remove(); if(opts.onCancel) opts.onCancel(); };
  }
  overlay.onclick = function(e){ if(e.target === overlay && opts.cancelLabel){ overlay.remove(); if(opts.onCancel) opts.onCancel(); } };
}

// Called from pgReport to render the full question/answer transcript for print
function reportFullQATranscript() {
  return SECTIONS.map(sec => {
    const meta = SEC_META[sec];
    const qs = QUESTIONS.filter(q=>q.sec===sec);
    return `<div style="margin-bottom:20px;break-inside:avoid">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)">
        Section ${meta.tag} — ${meta.title} (Weight: ${meta.weight*100|0}%)
      </div>
      ${qs.map((q,qi)=>{
        const ans = S.answers[q.id];
        const selectedOpts = q.multi
          ? (Array.isArray(ans)?ans:[]).map(i=>q.opts[i])
          : ans!=null?[q.opts[ans]]:[];
        return `<div style="margin-bottom:12px">
          <div style="font-size:12px;font-weight:500;color:var(--text);margin-bottom:4px">${QUESTIONS.indexOf(q)+1}. ${q.label}</div>
          ${selectedOpts.length
            ? selectedOpts.map(opt=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 10px;background:var(--navy);border-radius:5px;margin-bottom:3px">
                <i class="ti ti-check" style="font-size:11px;color:var(--gold2);flex-shrink:0;margin-top:2px"></i>
                <span style="font-size:11px;color:#fff">${opt[0]} <span style="color:rgba(255,255,255,.5)">(score: ${opt[1]})</span></span>
              </div>`).join('')
            : `<div style="font-size:11px;color:var(--red);padding:4px 8px">Not answered</div>`
          }
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}


function printFullReport() {
  const el = document.getElementById('print-transcript');

    el.style.display = '';
    // Re-render QA transcript
    const qaEl = document.getElementById('qa-transcript');
    if (qaEl) qaEl.innerHTML = reportFullQATranscript();

// ── PDF GENERATION ─────────────────────────────────────────────────────────
// Opens a clean print-friendly version — user clicks Save as PDF in dialog
// Works on Chrome mobile (Share → Print → Save as PDF) and desktop
function downloadPDF() {
  // Show the full transcript before printing
  const el = document.getElementById('print-transcript');
  if (el) {
    el.style.display = '';
    const qaEl = document.getElementById('qa-transcript');
    if (qaEl) qaEl.innerHTML = reportFullQATranscript();
  }
  // Small delay so DOM updates, then trigger print dialog
  // On Chrome/mobile: Print → Save as PDF (no printer needed)
  // On Safari/iOS: Share → Print → pinch-zoom to PDF
  setTimeout(() => {
    window.print();
    setTimeout(() => { if(el) el.style.display='none'; }, 2000);
  }, 150);
}

// printFullReport is just an alias now
function printFullReport() { downloadPDF(); }

function proceedToCKYC() {
  var signDone = false;
  if(_signMode === 'draw' && _signHasData) signDone = true;
  if(_signMode === 'type') {
    var typed = (document.getElementById('esign-type-input')||{}).value||'';
    if(typed.trim().length > 1) signDone = true;
  }
  if(_signMode === 'upload' && _signHasData) signDone = true;
  if(!signDone) {
    var sigWrap = document.querySelector('.esign-wrap');
    if(sigWrap){ sigWrap.style.outline='2px solid var(--red)'; setTimeout(function(){ sigWrap.style.outline=''; },2000); }
    toast('Please sign the risk profile before continuing.');
    return;
  }
  S._signCaptured = true;
  go('ckyc');
}

function handleSigUpload(input) {
  var file = input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = document.getElementById('esign-upload-preview');
    var lbl = document.getElementById('esign-upload-label');
    if(img){ img.src=e.target.result; img.style.display='block'; }
    if(lbl) lbl.textContent = '✓ '+file.name;
    _signHasData = true;
    updateSignStatus();
  };
  reader.readAsDataURL(file);
}






// ── VALIDATION ────────────────────────────────────────────────────────────────
function validatePAN(pan){
  return /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test((pan||'').toUpperCase());
}
function validateMobile(mob, rs){
  var d = (mob||'').replace(/[^0-9]/g,'');
  return rs==='NRI' ? (d.length>=8 && d.length<=15) : d.length===10;
}
function validateEmail(em){
  return !em || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);
}
function validateClientForm(){
  var d = S.details, errs = {};
  if(!d.name || d.name.trim().length<2)
    errs.name = 'Please enter your full name.';
  if(!d.pan)
    errs.pan = 'Please enter your PAN.';
  else if(!validatePAN(d.pan))
    errs.pan = 'Please enter a valid PAN in the format AAAAA9999A.';
  if(!d.dob)
    errs.dob = 'Please enter your date of birth.';
  else if(new Date(d.dob) > new Date())
    errs.dob = 'Date of birth cannot be in the future.';
  if(!d.mobile)
    errs.mobile = 'Please enter your mobile number.';
  else if(!validateMobile(d.mobile, d.resStatus||'RI'))
    errs.mobile = (d.resStatus==='NRI') ? 'Please enter a valid mobile number with country code (8-15 digits).' : 'Please enter a valid 10-digit mobile number.';
  if(!d.email)
    errs.email = 'Please enter your email address.';
  else if(!validateEmail(d.email))
    errs.email = 'Please enter a valid email address.';
  if(!d.city || d.city.trim().length<2)
    errs.city = 'Please enter your city or place.';
  return errs;
}
function submitDetails(){
  var errs = validateClientForm();
  var errList = Object.values(errs);
  S._detailErrs = errs;
  if(errList.length){
    render();
    showObModal({
      kind: 'err',
      title: 'Please fix the following',
      body: '\u2022 ' + errList.join('\n\u2022 ')
    });
    return;
  }
  go('disclosures');
}
